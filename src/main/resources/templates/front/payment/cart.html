<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/front/common :: frontHead"></head>

<body class="common-home res layout-1">
	<div id="wrapper" class="wrapper-fluid banners-effect-3">
		<header id="header" class="typeheader-1" th:replace="fragments/front/common :: frontHeader"></header>

		<div class="main-container container">
			<ul class="breadcrumb">
				<li><a href="/"><i class="fa fa-home"></i></a></li>
				<li><a href="#">장바구니</a></li>
			</ul>

			<!-- ===== Progress Step ===== -->
			<div class="cart-progress cart-hpad">
				<ul class="cart-progress-steps">
					<li class="step active">
						<div class="badge">STEP. 01</div>
						<div class="label">장바구니</div>
					</li>
					<li class="step">
						<div class="badge">STEP. 02</div>
						<div class="label">주문서 작성</div>
					</li>
					<li class="step">
						<div class="badge">STEP. 03</div>
						<div class="label">주문 결제 완료</div>
					</li>
				</ul>
			</div>

			<!-- ===== Cart Table ===== -->
			<div class="cartPage-wrap cart-hpad">
				<div class="table-responsive">
					<table class="table cart-table">
						<thead>
							<tr>
								<th class="col-check"><input type="checkbox" id="cart-checkall"></th>
								<th class="col-catno">Cat. No</th>
								<th class="col-name">품명</th>
								<th class="col-calib">옵션</th>
								<th class="col-price">판매가</th>
								<th class="col-dealer">딜러가</th>
								<th class="col-unit">단위</th>
								<th class="col-qty">수량</th>
							</tr>
						</thead>
						<tbody id="cart-tbody">
							<!-- ✅ JS 렌더링 영역 -->
						</tbody>
					</table>
				</div>

				<!-- 액션 버튼 -->
				<div class="cart-actions d-flex justify-content-between align-items-center cart-hpad">
					<div class="left cart-ops">
						<button type="button" class="btn btn-outline-gray btn-unify" id="btn-delete">삭제</button>
						<button type="button" class="btn btn-outline-gray btn-unify" id="btn-empty">장바구니 비우기</button>
					</div>
					<div class="right cart-ops">
						<button type="button" class="btn btn-cart-primary btn-unify" id="btn-qty-apply">수량 변경</button>
					</div>
				</div>

				<!-- 합계 -->
				<div class="cart-total-wrap cart-hpad">
					<div class="totals-table">
						<div class="trow head">
							<div>총 상품금액</div>
							<div>부가세(10%)</div>
							<div>총 배송비</div>
							<div>총 할인금액</div>
							<div>최종 결제 금액</div>
						</div>
						<div class="trow body">
							<div><span id="total-products">0</span> 원</div>
							<div><span id="total-vat">0</span> 원</div>
							<div><span id="total-shipping">0</span> 원</div>
							<div><span id="total-discount">0</span> 원</div>
							<div class="strong"><span id="total-final">0</span> 원</div>
						</div>
					</div>

					<!-- 모바일 요약 -->
					<div class="mobile-summary">
						<div class="ms-left">
							<div class="ms-head">최종 결제 금액</div>
							<div class="ms-price"><strong><span id="m-total-final">0</span> 원</strong></div>
						</div>
						<div class="ms-right">
							<button type="button" class="btn btn-outline-gray btn-unify" data-toggle="modal"
								data-target="#detailModal">상세내역</button>
						</div>
					</div>
				</div>

				<!-- 하단 구매 버튼 -->
				<div class="final-bar cart-hpad">
					<div class="final-actions">
						<button type="button" class="btn btn-cart-success btn-unify" id="btn-buy-selected">선택상품
							구매</button>
						<button type="button" class="btn btn-cart-primary btn-unify" id="btn-buy-all">전체구매</button>
					</div>
				</div>
			</div>
		</div>

		<footer class="footer-container typefooter-1" th:replace="fragments/front/common :: frontFooter"></footer>
	</div>

	<!-- ===== 모바일 상세내역 모달 ===== -->
	<div class="modal fade cart-mobile-modal-root" id="detailModal" tabindex="-1" role="dialog" aria-hidden="true">
		<div class="modal-dialog cart-mobile-modal-dialog" role="document">
			<div class="modal-content cart-mobile-modal-content">
				<div class="cart-mobile-modal-header">
					<h4 class="cart-mobile-modal-title">상세내역</h4>
					<button type="button" class="cart-mobile-modal-close" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>

				<div class="cart-mobile-modal-body">
					<!-- ✅ JS가 여기 렌더링 -->
					<div class="cart-mobile-modal-loading" style="display:none;">불러오는 중...</div>
					<div class="cart-mobile-modal-items"></div>
				</div>

				<div class="cart-mobile-modal-footer">
					<button type="button" class="btn btn-outline-gray btn-unify" data-dismiss="modal">닫기</button>
				</div>
			</div>
		</div>
	</div>

	<th:block th:replace="fragments/front/common :: frontScript"></th:block>

	<!-- ✅ cart.js가 사용하는 로그인/인증 정보 주입 -->
	<script th:inline="javascript">
		// 로그인 ID (컨트롤러에서 cartMemberId 내려줌)
		window.__loginMemberId = /*[[${cartMemberId}]]*/ null;

		// ✅ cart.js는 이 값이 true여야 "로그인 상태"로 판단합니다.
		// sec:authorize 를 이용해 정확히 주입합니다.
		window.__isAuthenticated = /*[[${#authorization.expression('isAuthenticated()')}]]*/ false;
	</script>

	<!-- ✅ 장바구니 페이지 전용 -->
	<script type="text/javascript" src="/front/js/page/cart-page.js"></script>

</body>

</html>
