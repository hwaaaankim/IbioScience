<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/front/common :: frontHead"></head>

<body class="common-home res layout-1">
	<div id="wrapper" class="wrapper-fluid banners-effect-3">
		<header id="header" class="typeheader-1" th:replace="fragments/front/common :: frontHeader"></header>

		<div class="main-container container">
			<ul class="breadcrumb">
				<li><a href="/"><i class="fa fa-home"></i></a></li>
				<li><a href="#">쇼핑</a></li>
				<li><a href="#">결제완료</a></li>
			</ul>

			<!-- ===== Progress ===== -->
			<div class="cart-progress cart-hpad">
				<ul class="cart-progress-steps">
					<li class="step">
						<div class="badge">STEP. 01</div>
						<div class="label">장바구니</div>
					</li>
					<li class="step">
						<div class="badge">STEP. 02</div>
						<div class="label">주문서 작성</div>
					</li>
					<li class="step active">
						<div class="badge">STEP. 03</div>
						<div class="label">주문 결제 완료</div>
					</li>
				</ul>
			</div>

			<!-- ===== 완료/에러 헤더 영역 ===== -->
			<section class="paymentEnd-head">

				<!-- 성공 아이콘 -->
				<div class="paymentEnd-headIcon" aria-hidden="true"
					 th:if="${orderDetail.status == 'PAYMENT_COMPLETED'}">
					<svg width="72" height="72" viewBox="0 0 72 72">
						<circle cx="36" cy="36" r="34" fill="#22c55e" />
						<path d="M23 37.5l9.2 9.2L49 29" fill="none" stroke="#ffffff" stroke-width="4"
							  stroke-linecap="round" stroke-linejoin="round" />
					</svg>
				</div>

				<!-- 에러 아이콘 -->
				<div class="paymentEnd-headIcon" aria-hidden="true"
					 th:if="${orderDetail.status == 'PAYMENT_ERROR'}">
					<svg width="72" height="72" viewBox="0 0 72 72">
						<circle cx="36" cy="36" r="34" fill="#ef4444" />
						<path d="M25 25 L47 47" stroke="#ffffff" stroke-width="4" />
						<path d="M47 25 L25 47" stroke="#ffffff" stroke-width="4" />
					</svg>
				</div>

				<h2 class="paymentEnd-headTitle"
					th:if="${orderDetail.status == 'PAYMENT_COMPLETED'}">
					주문해주셔서 감사드립니다.
				</h2>
				<p class="paymentEnd-headSub"
				   th:if="${orderDetail.status == 'PAYMENT_COMPLETED'}">
					고객님의 주문이 정상적으로 접수 되었습니다.
				</p>

				<h2 class="paymentEnd-headTitle"
					th:if="${orderDetail.status == 'PAYMENT_ERROR'}">
					결제 에러가 발생하였습니다.
				</h2>
				<p class="paymentEnd-headSub"
				   th:if="${orderDetail.status == 'PAYMENT_ERROR'}">
					관리자에게 문의 주시면 빠르게 해결하도록 하겠습니다.
				</p>
			</section>

			<!-- ===== 주문 상품 테이블 ===== -->
			<section class="paymentEnd-orderTable-wrap">
				<div class="paymentEnd-divider-strong"></div>

				<table class="table paymentEnd-orderTable">
					<thead>
						<tr>
							<th>상품정보</th>
							<th class="text-end">판매가</th>
							<th class="text-end">배송비</th>
							<th class="text-end">적립금</th>
							<th class="text-center">수량</th>
							<th class="text-end">할인금액</th>
							<th class="text-end">합계금액</th>
						</tr>
					</thead>

					<tbody>
						<tr th:each="it : ${orderDetail.items}">
							<td>
								<div class="paymentEnd-prod">
									<img th:src="${it.productImageUrl}" class="paymentEnd-prod-thumb">
									<div class="paymentEnd-prod-info">
										<div class="paymentEnd-prod-name" th:text="${it.productName}"></div>
										<div class="paymentEnd-prod-sku text-muted">
											Product ID : <span th:text="${it.productId}"></span> /
											옵션 : <span th:text="${it.optionLabel}"></span> /
											단위 : <span th:text="${it.unitText}"></span>
										</div>
									</div>
								</div>
							</td>

							<td class="text-end">
								<span th:text="${#numbers.formatInteger(it.unitPrice,0,'COMMA')}"></span>원
							</td>

							<!-- ✅ 배송비는 상품 단위가 아닌 주문 단위 -->
							<td class="text-end">
								<span>(공통)</span>
							</td>

							<!-- ✅ 상품별 적립금 -->
							<td class="text-end">
								<span th:text="${#numbers.formatInteger(it.itemEarnPoint,0,'COMMA')}"></span>원
							</td>

							<td class="text-center">
								<span th:text="${it.quantity}"></span>
							</td>

							<td class="text-end">
								<span th:text="${#numbers.formatInteger(it.discount,0,'COMMA')}"></span>원
							</td>

							<td class="text-end">
								<span th:text="${#numbers.formatInteger(it.subtotal,0,'COMMA')}"></span>원
							</td>
						</tr>
					</tbody>
				</table>

				<div class="paymentEnd-divider-soft"></div>

				<!-- ===== 주문 요약 정보 ===== -->
				<div class="paymentEnd-orderInfo">
					<div>
						<strong>주문번호</strong> :
						<span th:text="${orderDetail.orderNo}"></span>
					</div>
					<div>
						<strong>배송비</strong> :
						<span th:text="${#numbers.formatInteger(orderDetail.shippingFee,0,'COMMA')}"></span>원
					</div>
					<div>
						<strong>총 적립금</strong> :
						<span th:text="${#numbers.formatInteger(orderDetail.expectPoint,0,'COMMA')}"></span>원
					</div>
				</div>

				<div class="paymentEnd-actionBtns mb-2">
					<a href="/myPage" class="btn paymentEnd-btnPrimary">마이페이지 바로가기 →</a>
					<a href="/" class="btn paymentEnd-btnGhost">메인으로 바로가기 →</a>
				</div>

				<div class="paymentEnd-divider-strong"></div>
			</section>
		</div>

		<footer class="footer-container typefooter-1"
				th:replace="fragments/front/common :: frontFooter"></footer>
	</div>

	<th:block th:replace="fragments/front/common :: frontScript"></th:block>
</body>
</html>
