<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/front/common :: frontHead"></head>

<body class="common-home res layout-1">

	<div id="wrapper" class="wrapper-fluid banners-effect-3">
		<header id="header" class=" typeheader-1" th:replace="fragments/front/common :: frontHeader"></header>
		<div class="main-container container">
			<ul class="breadcrumb">
				<li><a href="#"><i class="fa fa-home"></i></a></li>
				<li><a href="#">마이페이지</a></li>
			</ul>

			<div class="row">
				<div id="content" class="col-md-12 col-sm-12 col-xs-12">
					<div class="producttab">
						<div class="tabsslider vertical-tabs col-xs-12">
							<th:block th:replace="fragments/front/common :: myPageSideMenu"></th:block>
							<div class="col-lg-10 col-md-10 col-sm-12 col-xs-12 pb-3"
								style="border-left:1px solid #ddd;">
								<h3 class="community-title text-center">교환/반품신청</h3>
								<!-- ======================= 마이페이지 메인 ======================= -->
								<div class="myPage-main-area">

									<!-- ===================== 교환/반품신청 ===================== -->
									<!-- ===== 교환/반품신청 ===== -->
									<div class="exchangeReturn-page-wrap">

										<!-- 상단 필터 -->
										<div class="exchangeReturn-page-filter">
											<div class="row gx-2 gy-2 align-items-end">
												<!-- 시작일 -->
												<div class="col-lg-5 col-md-5 col-sm-12 col-xs-12">
													<label for="exchangeReturn-page-start"
														class="exchangeReturn-page-label">시작일</label>
													<input type="date" id="exchangeReturn-page-start"
														class="form-control exchangeReturn-page-control">
												</div>
												<!-- 종료일 -->
												<div class="col-lg-5 col-md-5 col-sm-12 col-xs-12">
													<label for="exchangeReturn-page-end"
														class="exchangeReturn-page-label">종료일</label>
													<input type="date" id="exchangeReturn-page-end"
														class="form-control exchangeReturn-page-control">
												</div>
												<!-- 검색 버튼 -->
												<div class="col-lg-2 col-md-2 col-sm-12 col-xs-12">
													<label
														class="exchangeReturn-page-label">검색</label>
													<button id="exchangeReturn-page-search" type="button"
														class="exchangeReturn-page-btn w-100 align-self-end">검색</button>
												</div>
											</div>
										</div>

										<!-- 주문 리스트 -->
										<div class="exchangeReturn-page-list mt-3">
											<div class="exchangeReturn-page-tableWrap">
												<table class="exchangeReturn-page-table">
													<colgroup>
														<col style="width:56px"> <!-- 체크 -->
														<col> <!-- 오더내용 -->
														<col style="width:140px"> <!-- 전체가격 -->
														<col style="width:140px"> <!-- 주문상태 -->
														<col style="width:120px"> <!-- 가능여부 -->
													</colgroup>
													<thead>
														<tr>
															<th><input type="checkbox" id="exchangeReturn-page-checkAll"
																	aria-label="전체 선택"></th>
															<th class="text-start">오더내용</th>
															<th>전체가격</th>
															<th>주문상태</th>
															<th>가능여부</th>
														</tr>
													</thead>
													<tbody id="exchangeReturn-page-tbody"><!-- JS 렌더링 --></tbody>
												</table>
											</div>
										</div>

										<!-- 상세사항 + 파일 -->
										<div class="exchangeReturn-page-detail mt-3">
											<div class="mb-2">
												<label for="exchangeReturn-page-detail"
													class="exchangeReturn-page-label">상세사항</label>
												<textarea id="exchangeReturn-page-detail"
													class="form-control exchangeReturn-page-textarea" rows="6"
													placeholder="상세 요청사항을 입력하세요."></textarea>
											</div>

											<!-- 파일 업로드 -->
											<div class="exchangeReturn-page-fileArea">
												<!-- 숨김 파일 입력 (누적 추가) -->
												<input type="file" id="exchangeReturn-page-file" class="visually-hidden"
													multiple>
												<!-- 파일 액션 -->
												<div class="exchangeReturn-page-fileActions">
													<button type="button" id="exchangeReturn-page-clear"
														class="exchangeReturn-page-btn outline">전체삭제</button>
													<label for="exchangeReturn-page-file"
														class="exchangeReturn-page-btn file text-center">파일추가</label>
												</div>
												<!-- 업로드 목록 -->
												<div id="exchangeReturn-page-fileList"
													class="exchangeReturn-page-fileList"></div>
											</div>
										</div>
									</div>

								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<footer class="footer-container typefooter-1" th:replace="fragments/front/common :: frontFooter"></footer>
	</div>
	<th:block th:replace="fragments/front/common :: frontScript"></th:block>
	<th:block th:replace="fragments/front/common :: myPageBtnGroup"></th:block>
	<script src="/front/js/page/exchangeReturn.js"></script>
</body>

</html>
