<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/front/common :: frontHead"></head>

<body class="common-home res layout-1">

	<div id="wrapper" class="wrapper-fluid banners-effect-3">
		<header id="header" class=" typeheader-1" th:replace="fragments/front/common :: frontHeader"></header>
		<div class="main-container container">
			<ul class="breadcrumb">
				<li><a href="#"><i class="fa fa-home"></i></a></li>
				<li><a href="#">마이페이지</a></li>
			</ul>

			<div class="row">
				<div id="content" class="col-md-12 col-sm-12 col-xs-12">
					<div class="producttab">
						<div class="tabsslider vertical-tabs col-xs-12">
							<th:block th:replace="fragments/front/common :: myPageSideMenu"></th:block>
							<div class="col-lg-10 col-md-10 col-sm-12 col-xs-12 pb-3"
								style="border-left:1px solid #ddd;">
								<h3 class="community-title text-center">1:1문의리스트</h3>
								<!-- ======================= 마이페이지 메인 ======================= -->
								<div class="myPage-main-area">
									<!-- ===================== 1:1문의 리스트 ===================== -->
									<section class="inquiryList-table-section">

										<!-- 우측 정렬 필터 -->
										<div class="inquiryList-filter">
											<select id="inquiryList-pageSize" class="inquiryList-control">
												<option value="10">10개씩 보기</option>
												<option value="30">30개씩 보기</option>
												<option value="50">50개씩 보기</option>
											</select>

											<select id="inquiryList-sort" class="inquiryList-control">
												<option value="date_desc">작성일순 ↓</option>
												<option value="title_asc">가나다순</option>
											</select>

											<input id="inquiryList-keyword" class="inquiryList-control" type="text"
												placeholder="제목검색" />
											<button id="inquiryList-searchBtn" type="button"
												class="inquiryList-btn">검색</button>
										</div>

										<!-- 테이블 -->
										<div class="inquiryList-tablewrap">
											<table class="inquiryList-table">
												<colgroup>
													<col style="width:48px"> <!-- 체크박스 -->
													<col style="width:64px"> <!-- 번호 -->
													<col style="width:110px"> <!-- 답변여부 -->
													<col> <!-- 제목 -->
													<col style="width:120px"> <!-- 작성일 -->
													<col style="width:100px"> <!-- 공개여부 -->
												</colgroup>
												<thead>
													<tr>
														<th><input type="checkbox" id="inquiryList-checkAll"
																aria-label="전체 선택"></th>
														<th>NO</th>
														<th>답변여부</th>
														<th class="inquiryList-th-title">제목</th>
														<th>작성일</th>
														<th>공개여부</th>
													</tr>
												</thead>
												<tbody id="inquiryList-tbody">
													<!-- 샘플 -->
													<tr>
														<td><input type="checkbox" class="inquiryList-check"></td>
														<td>1</td>
														<td>답변대기</td>
														<td class="inquiryList-td-title">
															<a href="#" class="inquiryList-title"
																title="배송 관련 문의드립니다.">배송 관련 문의드립니다.</a>
														</td>
														<td>2025-08-10</td>
														<td>비공개</td>
													</tr>
													<tr>
														<td><input type="checkbox" class="inquiryList-check"></td>
														<td>1</td>
														<td>답변대기</td>
														<td class="inquiryList-td-title">
															<a href="#" class="inquiryList-title"
																title="배송 관련 문의드립니다.">배송 관련 문의드립니다.</a>
														</td>
														<td>2025-08-10</td>
														<td>비공개</td>
													</tr>
													<tr>
														<td><input type="checkbox" class="inquiryList-check"></td>
														<td>1</td>
														<td>답변대기</td>
														<td class="inquiryList-td-title">
															<a href="#" class="inquiryList-title"
																title="배송 관련 문의드립니다.">배송 관련 문의드립니다.</a>
														</td>
														<td>2025-08-10</td>
														<td>비공개</td>
													</tr>
												</tbody>
											</table>
										</div>

										<!-- 우측 정렬 액션 -->
										<div class="inquiryList-actions">
											<button id="inquiryList-deleteBtn" type="button"
												class="inquiryList-btn outline" disabled>삭제</button>
											<a href="/inquiry" class="inquiryList-btn">글쓰기</a>
										</div>

										<!-- 페이지네이션: 기존 구조 사용 -->
										<nav class="d-flex justify-content-center">
											<ul class="pagination">
												<li class="page-item"><a class="page-link" href="#">First</a></li>
												<li class="page-item"><a class="page-link" href="#">Previous</a></li>
												<li class="page-item active"><a class="page-link" href="#">1</a></li>
												<li class="page-item"><a class="page-link" href="#">Next</a></li>
												<li class="page-item"><a class="page-link" href="#">Last</a></li>
											</ul>
										</nav>
									</section>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<footer class="footer-container typefooter-1" th:replace="fragments/front/common :: frontFooter"></footer>
	</div>
	<th:block th:replace="fragments/front/common :: frontScript"></th:block>
	<th:block th:replace="fragments/front/common :: myPageBtnGroup"></th:block>
	<script src="/front/js/page/inquiryList.js"></script>
</body>

</html>
