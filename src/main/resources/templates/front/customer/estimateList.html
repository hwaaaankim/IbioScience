<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/front/common :: frontHead"></head>

<body class="common-home res layout-1">

	<div id="wrapper" class="wrapper-fluid banners-effect-3">
		<header id="header" class=" typeheader-1" th:replace="fragments/front/common :: frontHeader"></header>
		<div class="main-container container">
			<ul class="breadcrumb">
				<li><a href="#"><i class="fa fa-home"></i></a></li>
				<li><a href="#">마이페이지</a></li>
			</ul>

			<div class="row">
				<div id="content" class="col-md-12 col-sm-12 col-xs-12">
					<div class="producttab">
						<div class="tabsslider vertical-tabs col-xs-12">
							<th:block th:replace="fragments/front/common :: myPageSideMenu"></th:block>

							<div class="col-lg-10 col-md-10 col-sm-12 col-xs-12 pb-3"
								style="border-left:1px solid #ddd;">
								<h3 class="community-title text-center">견적문의내역</h3>

								<div class="myPage-main-area">

									<section class="estimateList-table-section">

										<div class="estimateList-filter customer-estimate-list-filter-wrap">
											<select id="customer-estimate-list-page-size" class="estimateList-control">
												<option value="10">10개씩 보기</option>
												<option value="30">30개씩 보기</option>
												<option value="50">50개씩 보기</option>
												<option value="100">100개씩 보기</option>
											</select>

											<input type="date"
												id="customer-estimate-list-date-from"
												class="estimateList-control customer-estimate-list-date-input">

											<input type="date"
												id="customer-estimate-list-date-to"
												class="estimateList-control customer-estimate-list-date-input">

											<input id="customer-estimate-list-keyword"
												class="estimateList-control"
												type="text"
												placeholder="제목검색" />

											<button id="customer-estimate-list-search-btn" type="button"
												class="estimateList-btn">검색</button>
										</div>

										<div class="estimateList-tablewrap">
											<table class="estimateList-table">
												<colgroup>
													<col style="width:48px">
													<col style="width:64px">
													<col style="width:120px">
													<col style="width:120px">
													<col>
													<col style="width:140px">
													<col style="width:140px">
													<col style="width:140px">
												</colgroup>
												<thead>
													<tr>
														<th>
															<input type="checkbox"
																id="customer-estimate-list-check-all"
																aria-label="전체 선택">
														</th>
														<th>NO</th>

														<th>
															<div class="customer-estimate-list-sort-head">
																<span>답변여부</span>
																<div class="customer-estimate-list-sort-buttons">
																	<button type="button"
																		class="customer-estimate-list-sort-btn"
																		data-sort="answerStatus"
																		data-dir="asc">▲</button>
																	<button type="button"
																		class="customer-estimate-list-sort-btn"
																		data-sort="answerStatus"
																		data-dir="desc">▼</button>
																</div>
															</div>
														</th>

														<th class="customer-estimate-list-mobile-hidden">
															<div class="customer-estimate-list-sort-head">
																<span>확인여부</span>
																<div class="customer-estimate-list-sort-buttons">
																	<button type="button"
																		class="customer-estimate-list-sort-btn"
																		data-sort="checkStatus"
																		data-dir="asc">▲</button>
																	<button type="button"
																		class="customer-estimate-list-sort-btn"
																		data-sort="checkStatus"
																		data-dir="desc">▼</button>
																</div>
															</div>
														</th>

														<th class="estimateList-th-title">
															<div class="customer-estimate-list-sort-head">
																<span>제목</span>
																<div class="customer-estimate-list-sort-buttons">
																	<button type="button"
																		class="customer-estimate-list-sort-btn"
																		data-sort="title"
																		data-dir="asc">▲</button>
																	<button type="button"
																		class="customer-estimate-list-sort-btn"
																		data-sort="title"
																		data-dir="desc">▼</button>
																</div>
															</div>
														</th>

														<th>
															<div class="customer-estimate-list-sort-head">
																<span>작성일</span>
																<div class="customer-estimate-list-sort-buttons">
																	<button type="button"
																		class="customer-estimate-list-sort-btn"
																		data-sort="requestedAt"
																		data-dir="asc">▲</button>
																	<button type="button"
																		class="customer-estimate-list-sort-btn"
																		data-sort="requestedAt"
																		data-dir="desc">▼</button>
																</div>
															</div>
														</th>

														<th class="customer-estimate-list-mobile-hidden">
															<div class="customer-estimate-list-sort-head">
																<span>확인날짜</span>
																<div class="customer-estimate-list-sort-buttons">
																	<button type="button"
																		class="customer-estimate-list-sort-btn"
																		data-sort="checkedAt"
																		data-dir="asc">▲</button>
																	<button type="button"
																		class="customer-estimate-list-sort-btn"
																		data-sort="checkedAt"
																		data-dir="desc">▼</button>
																</div>
															</div>
														</th>

														<th class="customer-estimate-list-mobile-hidden">
															<div class="customer-estimate-list-sort-head">
																<span>답변날짜</span>
																<div class="customer-estimate-list-sort-buttons">
																	<button type="button"
																		class="customer-estimate-list-sort-btn"
																		data-sort="answeredAt"
																		data-dir="asc">▲</button>
																	<button type="button"
																		class="customer-estimate-list-sort-btn"
																		data-sort="answeredAt"
																		data-dir="desc">▼</button>
																</div>
															</div>
														</th>
													</tr>
												</thead>
												<tbody id="customer-estimate-list-tbody">
												</tbody>
											</table>
										</div>

										<div class="estimateList-actions">
											<button id="customer-estimate-list-delete-btn" type="button"
												class="estimateList-btn outline" disabled>삭제</button>
											<a href="/customer/estimate" class="estimateList-btn">문의하기</a>
										</div>

										<nav class="d-flex justify-content-center">
											<ul class="pagination" id="customer-estimate-list-pagination"></ul>
										</nav>
									</section>

								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<footer class="footer-container typefooter-1" th:replace="fragments/front/common :: frontFooter"></footer>
	</div>

	<th:block th:replace="fragments/front/common :: frontScript"></th:block>
	<th:block th:replace="fragments/front/common :: myPageBtnGroup"></th:block>

	<script>
		/*
		 * 프론트 삭제 정책
		 * 1) ALWAYS
		 * 2) BEFORE_CHECK_ONLY
		 * 3) CHECKED_BUT_NOT_ANSWERED_ONLY
		 */
		window.CUSTOMER_ESTIMATE_DELETE_POLICY = 'ALWAYS';
	</script>

	<script src="/front/js/page/estimateList.js"></script>
</body>

</html>
