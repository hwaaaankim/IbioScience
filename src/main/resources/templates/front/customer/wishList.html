<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/front/common :: frontHead"></head>

<body class="common-home res layout-1">
	<div id="wrapper" class="wrapper-fluid banners-effect-3">
		<header id="header" class="typeheader-1" th:replace="fragments/front/common :: frontHeader"></header>

		<div class="main-container container">
			<ul class="breadcrumb">
				<li><a href="#"><i class="fa fa-home"></i></a></li>
				<li><a href="#">마이페이지</a></li>
			</ul>

			<div class="row">
				<div id="content" class="col-md-12 col-sm-12 col-xs-12">
					<div class="producttab">
						<div class="tabsslider vertical-tabs col-xs-12">

							<th:block th:replace="fragments/front/common :: myPageSideMenu"></th:block>

							<div class="col-lg-10 col-md-10 col-sm-12 col-xs-12 pb-3 p-l-m-n p-r-m-n"
								style="border-left:1px solid #ddd;">
								<h3 class="community-title text-center">관심상품</h3>

								<section class="wishList-table-section">

									<form id="wishListForm"
										th:action="@{'/customer/wishList/' + ${#authentication.principal.member.id}}"
										method="get">

										<input type="hidden" name="page" th:value="${page}" />

										<div class="wishList-filter">
											<select id="wishList-status" name="sale" class="wishList-control">
												<option value="all" th:selected="${sale == 'all'}">판매여부 전체</option>
												<option value="on" th:selected="${sale == 'on'}">판매중</option>
												<option value="off" th:selected="${sale == 'off'}">판매중지</option>
											</select>

											<select id="wishList-pageSize" name="size" class="wishList-control">
												<option value="10" th:selected="${size == 10}">10개씩 보기</option>
												<option value="30" th:selected="${size == 30}">30개씩 보기</option>
												<option value="50" th:selected="${size == 50}">50개씩 보기</option>
												<option value="70" th:selected="${size == 70}">70개씩 보기</option>
												<option value="100" th:selected="${size == 100}">100개씩 보기</option>
											</select>

											<button id="wishList-searchBtn" type="submit"
												class="wishList-btn">검색</button>
										</div>
									</form>

									<div class="wishList-tablewrap">
										<table class="wishList-table">
											<colgroup>
												<col style="width:48px">
												<col>
												<col style="width:180px">
												<col style="width:120px">
												<col style="width:140px">
												<col style="width:160px">
											</colgroup>
											<thead>
												<tr>
													<th><input type="checkbox" id="wishList-checkAll"
															aria-label="전체 선택"></th>
													<th>상품명</th>
													<th>옵션</th>
													<th>재고</th>
													<th>상품가</th>
													<th>비고</th>
												</tr>
											</thead>

											<tbody id="wishList-tbody">

												<tr th:if="${wishPage == null or #lists.isEmpty(wishPage.content)}">
													<td colspan="6" class="text-center">관심상품이 없습니다.</td>
												</tr>

												<th:block th:each="row : ${wishPage.content}">
													<tr class="wishList-row" th:attr="data-row-key=${row.rowKey},
																 data-target-id=${row.targetId},
																 data-product-type=${row.productType},
																 data-detail-url=${row.detailUrl}">
														<td>
															<input type="checkbox" class="wishList-check" th:attr="data-id=${row.targetId},
																		 data-product-type=${row.productType}">
														</td>

														<td class="wishList-td-product">
															<div class="wishList-product">
																<div class="wishList-thumb">
																	<img th:src="${row.mainImageUrl != null ? row.mainImageUrl : '/front/image/catalog/demo/product/270/e3.jpg'}"
																		alt="thumb">
																</div>
																<div class="wishList-pinfo">
																	<div
																		style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
																		<div class="wishList-pname"
																			th:title="${row.productName}"
																			th:text="${row.productName}">제품명</div>

																		<span class="label label-primary"
																			th:if="${row.productType != null and row.productType.name() == 'COMPANY'}">
																			우리회사제품
																		</span>

																		<span class="label label-success"
																			th:if="${row.productType != null and row.productType.name() == 'DEALER'}">
																			딜러제품
																		</span>
																	</div>

																	<div class="wishList-pbrand"
																		th:text="${row.brandName}">브랜드</div>
																</div>
															</div>
														</td>

														<td class="wishList-td-option">
															<span th:text="${row.optionCount + '개 옵션'}">0개 옵션</span>
														</td>

														<td class="wishList-td-qty">
															<span>0개</span>
														</td>

														<td class="wishList-td-price">
															<span class="wishList-price"
																th:text="${row.salePrice != null ? #numbers.formatInteger(row.salePrice,0,'COMMA') : '-'}">0</span>
															원
														</td>

														<td class="wishList-td-actions">
															<button type="button"
																class="wishList-btn block wishList-go-detail"
																th:disabled="${row.detailUrl == null}"
																th:attr="data-detail-url=${row.detailUrl}">
																상품바로가기
															</button>

															<button type="button"
																class="wishList-btn wishList-add-toggle-btn block"
																th:disabled="${!row.optionPanelEnabled}" th:attr="data-target-key=${row.rowKey},
																		 aria-controls=${'wishList-add-panel-' + row.rowKey}"
																th:text="${row.optionPanelEnabled ? '옵션보기' : '옵션없음'}">
																옵션보기
															</button>
														</td>
													</tr>

													<tr class="wishList-add-optrow" th:if="${row.optionPanelEnabled}"
														th:attr="id=${'wishList-add-panel-' + row.rowKey},
																 data-row-key=${row.rowKey},
																 data-parent-id=${row.targetId},
																 data-product-type=${row.productType}" aria-hidden="true">
														<td colspan="6">
															<div class="wishList-add-optpanel">
																<div class="wishList-add-scroll">
																	<table class="wishList-add-option-table">
																		<colgroup>
																			<col style="width:80px">
																			<col style="width:160px">
																			<col>
																			<col style="width:140px">
																			<col style="width:140px">
																			<col style="width:120px">
																		</colgroup>
																		<thead>
																			<tr>
																				<th>선택</th>
																				<th>CAT. NO</th>
																				<th>품명</th>
																				<th>판매가</th>
																				<th>단위</th>
																				<th>수량</th>
																			</tr>
																		</thead>

																		<tbody>
																			<tr
																				th:if="${row.optionGroups == null or #lists.isEmpty(row.optionGroups)}">
																				<td colspan="6" class="text-center">등록된
																					옵션이 없습니다.</td>
																			</tr>

																			<th:block th:each="g : ${row.optionGroups}">
																				<tr>
																					<td colspan="6"
																						class="product-list-option-group"
																						th:text="${g.groupName}">그룹명
																					</td>
																				</tr>

																				<tr th:each="opt : ${g.options}"
																					th:attr="
																						data-option-id=${opt.optionId},
																						data-option-group-id=${opt.optionGroupId},
																						data-option-group-name=${opt.optionGroupName},
																						data-option-name=${opt.optionName},
																						data-option-code=${opt.optionCode},
																						data-price=${opt.finalPrice}">
																					<td class="col-pick">
																						<input type="checkbox"
																							class="wishList-add-optpick">
																					</td>
																					<td class="col-cat"
																						th:text="${opt.optionCode}">-
																					</td>
																					<td class="col-name"
																						th:text="${opt.optionGroupName + ' - ' + opt.optionName}">
																						-</td>
																					<td class="col-price text-right"
																						th:text="${#numbers.formatInteger(opt.finalPrice,0,'COMMA')}">
																						0</td>
																					<td class="col-unit">-</td>
																					<td class="col-qty">
																						<input type="number"
																							class="wishList-add-optqty"
																							value="1" min="1">
																					</td>
																				</tr>
																			</th:block>
																		</tbody>
																	</table>

																	<div class="wishList-add-optpanel-footer">
																		<div class="wishList-add-optpanel-left">
																			<p class="wishList-add-note">
																				제품 가격 표시는 Cat. No. 단일 기준이며 옵션 총합과 다를 수
																				있습니다.<br>
																				가격/사양은 제조/공급사의 정책 변경에 따라 사전 공지 없이 변경될 수
																				있습니다.
																			</p>
																		</div>
																		<div class="wishList-add-optpanel-right">
																			<button type="button"
																				class="wishList-btn outline"
																				disabled>견적문의</button>
																			<button type="button"
																				class="wishList-btn wishList-add-cart">장바구니</button>
																			<button type="button"
																				class="wishList-btn wishList-primary"
																				disabled>바로구매</button>
																		</div>
																	</div>

																</div>
															</div>
														</td>
													</tr>
												</th:block>

											</tbody>
										</table>
									</div>

									<div class="wishList-actions"
										style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
										<button id="wishList-deleteBtn" type="button" class="wishList-btn outline"
											disabled>선택삭제</button>
									</div>

									<nav class="d-flex justify-content-center"
										th:if="${wishPage != null and wishPage.totalPages > 1}">
										<ul class="pagination">
											<li class="page-item" th:classappend="${wishPage.first} ? 'disabled'">
												<a class="page-link" href="#" data-page="0">First</a>
											</li>
											<li class="page-item" th:classappend="${wishPage.first} ? 'disabled'">
												<a class="page-link" href="#"
													th:attr="data-page=${wishPage.number - 1}">Previous</a>
											</li>

											<li class="page-item"
												th:each="pNum : ${#numbers.sequence(0, wishPage.totalPages - 1)}"
												th:classappend="${pNum == wishPage.number} ? 'active'">
												<a class="page-link" href="#" th:text="${pNum + 1}"
													th:attr="data-page=${pNum}">1</a>
											</li>

											<li class="page-item" th:classappend="${wishPage.last} ? 'disabled'">
												<a class="page-link" href="#"
													th:attr="data-page=${wishPage.number + 1}">Next</a>
											</li>
											<li class="page-item" th:classappend="${wishPage.last} ? 'disabled'">
												<a class="page-link" href="#"
													th:attr="data-page=${wishPage.totalPages - 1}">Last</a>
											</li>
										</ul>
									</nav>

								</section>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<footer class="footer-container typefooter-1" th:replace="fragments/front/common :: frontFooter"></footer>
	</div>

	<th:block th:replace="fragments/front/common :: frontScript"></th:block>
	<script src="/front/js/page/wishList.js"></script>
</body>

</html>
