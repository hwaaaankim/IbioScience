<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/front/common :: frontHead"></head>

<body class="common-home res layout-1">
	<div id="wrapper" class="wrapper-fluid banners-effect-3">
		<header id="header" class=" typeheader-1" th:replace="fragments/front/common :: frontHeader"></header>
		<div class="main-container container">
			<ul class="breadcrumb">
				<li><a href="/"><i class="fa fa-home"></i></a></li>
				<li><a href="#">마이페이지</a></li>
			</ul>

			<div class="row">
				<div id="content" class="col-md-12 col-sm-12 col-xs-12">
					<div class="producttab">
						<div class="tabsslider vertical-tabs col-xs-12">
							<th:block th:replace="fragments/front/common :: myPageSideMenu"></th:block>
							<div class="col-lg-10 col-md-10 col-sm-12 col-xs-12 pb-3"
								style="border-left:1px solid #ddd;">
								<h3 class="community-title text-center">개인회원정보수정</h3>
								<div class="myPage-main-area">
									<section class="personalInfoUpdate-section">

										<form id="personalInfoUpdate-form"
											th:action="@{/customer/personalInfoUpdateProcess}" method="post" novalidate
											th:attr="data-original-username=${member.username}">
											<input type="hidden" name="id" th:value="${member.id}">

											<div class="personalInfoUpdate-fieldset">
												<h4 class="personalInfoUpdate-legend">회원 정보</h4>

												<!-- 아이디 + 중복체크 -->
												<div class="row personalInfoUpdate-row">
													<label for="personalInfoUpdate-username"
														class="col-lg-3 col-md-3 col-sm-4 col-xs-12 personalInfoUpdate-label">
														회원아이디 <span class="personalInfoUpdate-required">*</span>
													</label>
													<div
														class="col-lg-9 col-md-9 col-sm-8 col-xs-12 personalInfoUpdate-controlwrap">
														<div class="personalInfoUpdate-inline">
															<input type="text" id="personalInfoUpdate-username"
																name="username"
																class="form-control personalInfoUpdate-input"
																placeholder="아이디" required maxlength="30"
																autocomplete="username" th:value="${member.username}">
															<button type="button"
																class="btn personalInfoUpdate-btn secondary"
																id="personalInfoUpdate-dupCheckBtn">중복검색</button>
														</div>
														<div class="personalInfoUpdate-help">영문/숫자 4~30자 권장</div>
													</div>
												</div>

												<!-- 이름 -->
												<div class="row personalInfoUpdate-row">
													<label for="personalInfoUpdate-name"
														class="col-lg-3 col-md-3 col-sm-4 col-xs-12 personalInfoUpdate-label">
														이름 <span class="personalInfoUpdate-required">*</span>
													</label>
													<div
														class="col-lg-9 col-md-9 col-sm-8 col-xs-12 personalInfoUpdate-controlwrap">
														<input type="text" id="personalInfoUpdate-name" name="name"
															class="form-control personalInfoUpdate-input"
															placeholder="이름" required maxlength="50" autocomplete="name"
															th:value="${member.name}">
													</div>
												</div>

												<!-- 비밀번호 (선택) -->
												<div class="row personalInfoUpdate-row">
													<label for="personalInfoUpdate-password"
														class="col-lg-3 col-md-3 col-sm-4 col-xs-12 personalInfoUpdate-label">
														비밀번호
													</label>
													<div
														class="col-lg-9 col-md-9 col-sm-8 col-xs-12 personalInfoUpdate-controlwrap">
														<input type="password" id="personalInfoUpdate-password"
															name="password"
															class="form-control personalInfoUpdate-input"
															placeholder="영문/숫자/특수문자 포함 8~32자" minlength="8"
															maxlength="32" autocomplete="new-password">
													</div>
												</div>

												<!-- 비밀번호 확인 (선택) -->
												<div class="row personalInfoUpdate-row">
													<label for="personalInfoUpdate-password2"
														class="col-lg-3 col-md-3 col-sm-4 col-xs-12 personalInfoUpdate-label">
														비밀번호 확인
													</label>
													<div
														class="col-lg-9 col-md-9 col-sm-8 col-xs-12 personalInfoUpdate-controlwrap">
														<input type="password" id="personalInfoUpdate-password2"
															name="password2"
															class="form-control personalInfoUpdate-input"
															placeholder="비밀번호를 다시 입력하세요" minlength="8" maxlength="32"
															autocomplete="new-password">
														<div id="personalInfoUpdate-pwMessage"
															class="personalInfoUpdate-msg"></div>
													</div>
												</div>

												<!-- 휴대폰번호 3-4-4 -->
												<div class="row personalInfoUpdate-row">
													<label
														class="col-lg-3 col-md-3 col-sm-4 col-xs-12 personalInfoUpdate-label">
														휴대폰 번호 <span class="personalInfoUpdate-required">*</span>
													</label>
													<div class="col-lg-9 col-md-9 col-sm-8 col-xs-12 personalInfoUpdate-controlwrap"
														th:with="mob=${member.mobile != null} ? ${#strings.arraySplit(member.mobile,'-')} : ${new String[]{'','',''}}">
														<div class="personalInfoUpdate-phonewrap">
															<input type="text" inputmode="numeric" pattern="[0-9]*"
																maxlength="3"
																class="form-control personalInfoUpdate-input personalInfoUpdate-phone"
																id="personalInfoUpdate-m1" name="mobile1" required
																th:value="${mob[0]}">
															<span class="personalInfoUpdate-dash">-</span>
															<input type="text" inputmode="numeric" pattern="[0-9]*"
																maxlength="4"
																class="form-control personalInfoUpdate-input personalInfoUpdate-phone"
																id="personalInfoUpdate-m2" name="mobile2" required
																th:value="${mob[1]}">
															<span class="personalInfoUpdate-dash">-</span>
															<input type="text" inputmode="numeric" pattern="[0-9]*"
																maxlength="4"
																class="form-control personalInfoUpdate-input personalInfoUpdate-phone"
																id="personalInfoUpdate-m3" name="mobile3" required
																th:value="${mob[2]}">
														</div>
													</div>
												</div>

												<!-- 사내번호 (선택) -->
												<div class="row personalInfoUpdate-row"
													th:with="tel=${member.tel != null} ? ${#strings.arraySplit(member.tel,'-')} : ${new String[]{'','',''}}">
													<label
														class="col-lg-3 col-md-3 col-sm-4 col-xs-12 personalInfoUpdate-label">사내번호</label>
													<div
														class="col-lg-9 col-md-9 col-sm-8 col-xs-12 personalInfoUpdate-controlwrap">
														<div class="personalInfoUpdate-phonewrap">
															<input type="text" inputmode="numeric" pattern="[0-9]*"
																maxlength="3"
																class="form-control personalInfoUpdate-input personalInfoUpdate-tel"
																id="personalInfoUpdate-t1" name="tel1"
																th:value="${tel[0]}">
															<span class="personalInfoUpdate-dash">-</span>
															<input type="text" inputmode="numeric" pattern="[0-9]*"
																maxlength="4"
																class="form-control personalInfoUpdate-input personalInfoUpdate-tel"
																id="personalInfoUpdate-t2" name="tel2"
																th:value="${tel[1]}">
															<span class="personalInfoUpdate-dash">-</span>
															<input type="text" inputmode="numeric" pattern="[0-9]*"
																maxlength="4"
																class="form-control personalInfoUpdate-input personalInfoUpdate-tel"
																id="personalInfoUpdate-t3" name="tel3"
																th:value="${tel[2]}">
														</div>
													</div>
												</div>

												<!-- 소속기관/부서 -->
												<div class="row personalInfoUpdate-row">
													<label for="personalInfoUpdate-org"
														class="col-lg-3 col-md-3 col-sm-4 col-xs-12 personalInfoUpdate-label">
														소속기관/부서
													</label>
													<div
														class="col-lg-9 col-md-9 col-sm-8 col-xs-12 personalInfoUpdate-controlwrap">
														<input type="text" id="personalInfoUpdate-org"
															name="organizationName"
															class="form-control personalInfoUpdate-input"
															th:value="${member.organizationName}"
															placeholder="(주)아이바이오사이언스">
													</div>
												</div>

												<!-- 주소 -->
												<div class="row personalInfoUpdate-row">
													<label
														class="col-lg-3 col-md-3 col-sm-4 col-xs-12 personalInfoUpdate-label">
														주소 <span class="personalInfoUpdate-required">*</span>
													</label>
													<div
														class="col-lg-9 col-md-9 col-sm-8 col-xs-12 personalInfoUpdate-controlwrap">
														<div class="personalInfoUpdate-inline">
															<input type="text" id="personalInfoUpdate-zip"
																name="zipcode"
																class="form-control personalInfoUpdate-input"
																placeholder="우편번호" readonly required
																th:value="${member.address != null ? member.address.postcode : ''}">
															<button type="button" class="btn personalInfoUpdate-btn"
																id="personalInfoUpdate-addrSearchBtn">주소 검색</button>
														</div>
														<input type="text" id="personalInfoUpdate-road"
															name="roadAddress"
															class="form-control personalInfoUpdate-input mt-6"
															placeholder="도로명주소" readonly required
															th:value="${member.address != null ? member.address.roadAddress : ''}">
														<input type="text" id="personalInfoUpdate-jibun"
															name="jibunAddress"
															class="form-control personalInfoUpdate-input mt-6"
															placeholder="지번주소" readonly
															th:value="${member.address != null ? member.address.jibunAddress : ''}">
														<input type="text" id="personalInfoUpdate-detail"
															name="detailAddress"
															class="form-control personalInfoUpdate-input mt-6"
															placeholder="상세주소(동/호수)"
															th:value="${member.address != null ? member.address.detailAddress : ''}">
													</div>
												</div>

												<!-- 이메일 -->
												<div class="row personalInfoUpdate-row">
													<label for="personalInfoUpdate-email"
														class="col-lg-3 col-md-3 col-sm-4 col-xs-12 personalInfoUpdate-label">
														이메일 <span class="personalInfoUpdate-required">*</span>
													</label>
													<div
														class="col-lg-9 col-md-9 col-sm-8 col-xs-12 personalInfoUpdate-controlwrap">
														<input type="email" id="personalInfoUpdate-email" name="email"
															class="form-control personalInfoUpdate-input"
															placeholder="name@example.com" required autocomplete="email"
															th:value="${member.email}">
														<div id="personalInfoUpdate-emailMsg"
															class="personalInfoUpdate-msg"></div>
													</div>
												</div>
											</div>

											<hr class="personalInfoUpdate-divider">

											<!-- 수신동의 고정 -->
											<div class="personalInfoUpdate-fieldset">
												<h4 class="personalInfoUpdate-legend">수신동의</h4>
												<div class="row personalInfoUpdate-row">
													<label
														class="col-lg-3 col-md-3 col-sm-4 col-xs-12 personalInfoUpdate-label">
														수신동의 <span class="personalInfoUpdate-required">*</span>
													</label>
													<div
														class="col-lg-9 col-md-9 col-sm-8 col-xs-12 personalInfoUpdate-controlwrap">
														<p class="personalInfoUpdate-desc">행사안내, 상품정보 등 마케팅 정보 수신(이메일,
															SMS)에 동의합니다.</p>
														<div class="personalInfoUpdate-radios">
															<label class="radio-inline"><input type="radio" checked
																	disabled> 동의함</label>
															<label class="radio-inline"><input type="radio" disabled>
																동의안함</label>
															<input type="hidden" name="agree" value="Y" />
														</div>
													</div>
												</div>
											</div>

											<div class="personalInfoUpdate-actions">
												<!-- ✅ 초기 비활성화 -->
												<button type="submit" id="personalInfoUpdate-submitBtn"
													class="btn personalInfoUpdate-btn" disabled>수정</button>
												<a href="/myPage" class="btn personalInfoUpdate-btn outline">취소</a>
											</div>
										</form>

									</section>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<footer class="footer-container typefooter-1" th:replace="fragments/front/common :: frontFooter"></footer>
		</div>
	</div>

	<th:block th:replace="fragments/front/common :: frontScript"></th:block>
	<th:block th:replace="fragments/front/common :: myPageBtnGroup"></th:block>
	<script src="/front/js/page/personalInfoUpdate.js"></script>
</body>

</html>
