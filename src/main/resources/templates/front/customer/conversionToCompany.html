<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/front/common :: frontHead"></head>

<body class="common-home res layout-1">
	<div id="wrapper" class="wrapper-fluid banners-effect-3">
		<header id="header" class="typeheader-1" th:replace="fragments/front/common :: frontHeader"></header>

		<div class="main-container container">
			<ul class="breadcrumb">
				<li><a href="/"><i class="fa fa-home"></i></a></li>
				<li><a href="#">기업회원전환</a></li>
			</ul>

			<div class="row">
				<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">

					<!-- ✅ 기업정보만 제출 (일반회원 기본정보는 이미 보유) -->
					<form id="conversionToCompanyForm" action="/customer/conversionToCompanyProcess" method="post"
						enctype="multipart/form-data">

						<div class="companySignUp-wrap">

							<!-- ===== 기업정보 ===== -->
							<section class="companySignUp-section">
								<div class="companySignUp-dividerTitle">기업정보</div>
								<div class="companySignUp-divider"></div>

								<div class="form-group">
									<label class="companySignUp-label required">회사명</label>
									<input type="text" class="form-control companySignUp-input" name="companyName"
										id="company-companyName" placeholder="회사명" required>
								</div>

								<div class="form-group">
									<label class="companySignUp-label">담당부서</label>
									<input type="text" class="form-control companySignUp-input" name="department"
										id="company-dept" placeholder="담당부서">
								</div>

								<div class="form-group">
									<label class="companySignUp-label required">대표자</label>
									<input type="text" class="form-control companySignUp-input" name="ceoName"
										id="company-ceo" placeholder="대표자 성명" required>
								</div>

								<div class="form-group">
									<label class="companySignUp-label required">업태</label>
									<input type="text" class="form-control companySignUp-input" name="businessType"
										id="company-bizType" placeholder="예: 제조업" required>
								</div>

								<div class="form-group">
									<label class="companySignUp-label required">업종</label>
									<input type="text" class="form-control companySignUp-input" name="businessItem"
										id="company-bizItem" placeholder="예: 전자부품" required>
								</div>

								<!-- 회사주소 -->
								<div class="form-group">
									<label class="companySignUp-label required">회사주소</label>
									<div class="companySignUp-flex companySignUp-gap10">
										<input type="text" readonly class="form-control companySignUp-input"
											name="cPostcode" id="company-zipcode" placeholder="우편번호" required>
										<button type="button"
											class="btn btn-primary companySignUp-btn companySignUp-eqBtn"
											id="company-addrSearchBtn">주소 검색</button>
									</div>
								</div>

								<div class="form-group">
									<input type="text" readonly class="form-control companySignUp-input"
										name="cRoadAddress" id="company-roadAddress" placeholder="도로명주소" required>
								</div>

								<div class="form-group">
									<input type="text" class="form-control companySignUp-input" name="cDetailAddress"
										id="company-detailAddress" placeholder="상세주소(동/호수)">
								</div>

								<div class="form-group">
									<label class="companySignUp-label required">담당자명</label>
									<input type="text" class="form-control companySignUp-input" name="managerName"
										id="company-managerName" placeholder="담당자명" required>
								</div>

								<div class="form-group">
									<label class="companySignUp-label required">담당자연락처</label>
									<div class="companySignUp-inline">
										<input type="text" inputmode="numeric"
											class="form-control companySignUp-input companySignUp-contact"
											id="company-contact-1" maxlength="3" placeholder="010" required>
										<span class="companySignUp-sep" aria-hidden="true"></span>
										<input type="text" inputmode="numeric"
											class="form-control companySignUp-input companySignUp-contact"
											id="company-contact-2" maxlength="4" placeholder="1234" required>
										<span class="companySignUp-sep" aria-hidden="true"></span>
										<input type="text" inputmode="numeric"
											class="form-control companySignUp-input companySignUp-contact"
											id="company-contact-3" maxlength="4" placeholder="5678" required>
									</div>
									<!-- 서버 전송용 -->
									<input type="hidden" name="managerPhone" id="company-managerPhone">
								</div>

								<div class="form-group">
									<label class="companySignUp-label required">기관분류</label>
									<select class="form-control companySignUp-input" name="organizationCategory"
										id="company-orgType" required>
										<option value="">선택</option>
										<option value="GROUP_A">제조업</option>
										<option value="GROUP_B">도소매/유통</option>
										<option value="GROUP_C">서비스/의료/연구/교육/공공/기타</option>
									</select>
								</div>

								<div class="mb-3" style="margin-bottom:2rem;"></div>

								<!-- 세금계산서 발행정보 -->
								<div class="companySignUp-dividerTitle">세금계산서 발행정보</div>
								<div class="companySignUp-divider"></div>

								<div class="form-group">
									<label class="companySignUp-label required">사업자등록번호</label>
									<input type="text" class="form-control companySignUp-input"
										name="businessRegistrationNumber" id="company-bizNo"
										placeholder="예: 123-45-67890" required>
								</div>

								<div class="form-group">
									<label class="companySignUp-label required">사업자등록증 (최소 1개)</label>
									<div class="companySignUp-fileRow">
										<input type="file" id="company-bizRegFiles" class="companySignUp-file"
											accept=".jpg,.jpeg,.png,.gif,.pdf,.bmp,.tif,.tiff,.webp" name="bizRegFiles"
											multiple required>
										<button type="button"
											class="btn btn-primary companySignUp-btn companySignUp-eqBtn"
											id="company-bizRegBtn">파일 첨부</button>
									</div>
									<div class="companySignUp-fileList" id="company-fileList"></div>
								</div>

								<div class="form-group">
									<label class="companySignUp-label">회사 대표번호</label>
									<div class="companySignUp-inline">
										<input type="text" inputmode="numeric"
											class="form-control companySignUp-input companySignUp-tel"
											id="company-rep-1" maxlength="3" placeholder="02">
										<span class="companySignUp-sep" aria-hidden="true"></span>
										<input type="text" inputmode="numeric"
											class="form-control companySignUp-input companySignUp-tel"
											id="company-rep-2" maxlength="4" placeholder="1234">
										<span class="companySignUp-sep" aria-hidden="true"></span>
										<input type="text" inputmode="numeric"
											class="form-control companySignUp-input companySignUp-tel"
											id="company-rep-3" maxlength="4" placeholder="5678">
									</div>
									<input type="hidden" name="representativeTel" id="company-representativeTel">
								</div>

								<div class="form-group">
									<label class="companySignUp-label">팩스번호</label>
									<div class="companySignUp-inline">
										<input type="text" inputmode="numeric"
											class="form-control companySignUp-input companySignUp-fax"
											id="company-fax-1" maxlength="3" placeholder="02">
										<span class="companySignUp-sep" aria-hidden="true"></span>
										<input type="text" inputmode="numeric"
											class="form-control companySignUp-input companySignUp-fax"
											id="company-fax-2" maxlength="4" placeholder="1234">
										<span class="companySignUp-sep" aria-hidden="true"></span>
										<input type="text" inputmode="numeric"
											class="form-control companySignUp-input companySignUp-fax"
											id="company-fax-3" maxlength="4" placeholder="5678">
									</div>
									<input type="hidden" name="fax" id="company-faxHidden">
								</div>

								<div class="form-group">
									<label class="companySignUp-label required">계산서 발행 이메일</label>
									<div class="companySignUp-inline">
										<input type="text" class="form-control companySignUp-input"
											id="company-invoice-email-id" placeholder="아이디" required>
										<span class="companySignUp-atSep" aria-hidden="true">@</span>
										<select id="company-invoice-email-domain-select"
											class="form-control companySignUp-input" required>
											<option value="">선택</option>
											<option value="gmail.com">gmail.com</option>
											<option value="naver.com">naver.com</option>
											<option value="hanmail.net">hanmail.net</option>
											<option value="daum.net">daum.net</option>
											<option value="nate.com">nate.com</option>
											<option value="yahoo.com">yahoo.com</option>
											<option value="direct">직접입력</option>
										</select>
									</div>
									<div id="company-invoice-email-domain-direct-wrap" class="hidden"
										style="margin-top:8px;">
										<input type="text" class="form-control companySignUp-input"
											id="company-invoice-email-domain-direct" placeholder="예: mycompany.co.kr">
									</div>
									<input type="hidden" name="invoiceEmail" id="company-invoiceEmail">
								</div>

								<div class="companySignUp-flex companySignUp-gap10" style="margin-top:16px;">
									<button type="submit" class="btn btn-primary companySignUp-btn companySignUp-eqBtn"
										style="flex:1;">
										전환 신청
									</button>
								</div>
							</section>
						</div>
					</form>

				</div>
			</div>
		</div>

		<footer class="footer-container typefooter-1" th:replace="fragments/front/common :: frontFooter"></footer>
	</div>

	<th:block th:replace="fragments/front/common :: frontScript"></th:block>
	<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
	<script src="/front/js/page/conversionToCompany.js"></script>
</body>

</html>
