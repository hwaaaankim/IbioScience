<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/front/common :: frontHead"></head>

<body class="common-home res layout-1">
	<div id="wrapper" class="wrapper-fluid banners-effect-3">
		<header id="header" class="typeheader-1" th:replace="fragments/front/common :: frontHeader"></header>

		<div class="main-container container">
			<ul class="breadcrumb">
				<li><a href="/"><i class="fa fa-home"></i></a></li>
				<li><a href="#">회원가입 완료</a></li>
			</ul>

			<div class="row">
				<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
					<div class="signUpSuccess-wrap">
						<h3 class="signUpSuccess-title">회원가입</h3>
						<div class="signUpSuccess-divider"></div>

						<div class="signUpSuccess-msg">
							<p class="lead">회원가입이 완료 되었습니다.</p>
							<p class="signUpSuccess-strong">
								<span th:text="${name}">홍길동</span>님의 회원가입을 축하합니다.
							</p>
							<p>알차고 실속있는 서비스로 찾아뵙겠습니다.</p>
						</div>

						<div class="signUpSuccess-actions">
							<a href="/" class="btn btn-default signUpSuccess-btn signUpSuccess-eqBtn">홈으로</a>
							<a href="/signin" class="btn btn-primary signUpSuccess-btn signUpSuccess-eqBtn">로그인</a>
						</div>
					</div>
				</div>
			</div>
		</div>

		<footer class="footer-container typefooter-1" th:replace="fragments/front/common :: frontFooter"></footer>
	</div>

	<th:block th:replace="fragments/front/common :: frontScript"></th:block>
</body>

</html>
