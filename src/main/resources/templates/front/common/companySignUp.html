<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/front/common :: frontHead"></head>

<body class="common-home res layout-1">
	<div id="wrapper" class="wrapper-fluid banners-effect-3">
		<header id="header" class="typeheader-1" th:replace="fragments/front/common :: frontHeader"></header>

		<div class="main-container container">
			<ul class="breadcrumb">
				<li><a href="/"><i class="fa fa-home"></i></a></li>
				<li><a href="#">기업회원 회원가입</a></li>
			</ul>

			<div class="row">
				<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
					<div class="companySignUp-wrap">

						<!-- ===== 2-Step Progress ===== -->
						<div class="companySignUp-stepper" id="companySignUp-stepper">
							<div class="companySignUp-step companySignUp-active" data-step="1">
								<div class="companySignUp-stepCircle"><span>1</span><small>STEP</small></div>
								<div class="companySignUp-stepLabel">계정정보입력</div>
							</div>
							<div class="companySignUp-step" data-step="2">
								<div class="companySignUp-stepCircle"><span>2</span><small>STEP</small></div>
								<div class="companySignUp-stepLabel">회사정보입력</div>
							</div>
						</div>

						<!-- ===== STEP 1: 계정정보(개인회원과 동일 항목) ===== -->
						<section class="companySignUp-section" id="companySignUp-step1">
							<h3 class="companySignUp-title">약관동의</h3>
							<div class="companySignUp-termsBox">
								<label class="companySignUp-agree-item companySignUp-agree-all">
									<input type="checkbox" id="companySignUp-agree-all"
										class="companySignUp-agree-check">
									<span class="companySignUp-agree-text"><b>전체 동의</b> <span
											class="companySignUp-agree-hint">(선택 정보 포함)</span></span>
								</label>
								<div class="companySignUp-agree-line">
									<label class="companySignUp-agree-item">
										<input type="checkbox" id="companySignUp-agree-terms"
											class="companySignUp-agree-check companySignUp-agree-required">
										<span class="companySignUp-agree-text">[필수] 이용약관 동의</span>
									</label>
									<a href="#" class="companySignUp-more">자세히보기 &gt;</a>
								</div>
								<div class="companySignUp-agree-line">
									<label class="companySignUp-agree-item">
										<input type="checkbox" id="companySignUp-agree-privacy"
											class="companySignUp-agree-check companySignUp-agree-required">
										<span class="companySignUp-agree-text">[필수] 개인정보 수집 및 이용 동의</span>
									</label>
									<a href="#" class="companySignUp-more">자세히보기 &gt;</a>
								</div>
								<label class="companySignUp-agree-item">
									<input type="checkbox" id="companySignUp-agree-sms"
										class="companySignUp-agree-check">
									<span class="companySignUp-agree-text">[선택] SMS 수신 동의</span>
								</label>
								<label class="companySignUp-agree-item">
									<input type="checkbox" id="companySignUp-agree-email"
										class="companySignUp-agree-check">
									<span class="companySignUp-agree-text">[선택] 이메일 수신 동의</span>
								</label>
							</div>

							<h3 class="companySignUp-title" style="margin-top:16px;">계정정보</h3>
							<p>* 만약 개인회원 이시라면? <a href="/companySignUp"> <i class="fas fa-arrow-circle-right"></i> 개인회원가입</a></p>
							<!-- 아이디 + 중복검사 -->
							<div class="companySignUp-flex companySignUp-gap10 companySignUp-alignEnd">
								<div class="companySignUp-flexItem">
									<label for="companySignUp-userId" class="companySignUp-label required">아이디</label>
									<input type="text" class="form-control companySignUp-input"
										id="companySignUp-userId" placeholder="아이디를 입력하세요">
								</div>
								<div class="companySignUp-btnWrap">
									<button type="button" class="btn btn-primary companySignUp-btn companySignUp-eqBtn"
										id="companySignUp-idCheckBtn">중복검사</button>
								</div>
							</div>

							<!-- 비밀번호 / 확인 -->
							<div class="form-group">
								<label for="companySignUp-password" class="companySignUp-label required">비밀번호</label>
								<input type="password" class="form-control companySignUp-input"
									id="companySignUp-password" placeholder="영문/숫자/특수문자 조합 8~16자">
							</div>
							<div class="form-group">
								<label for="companySignUp-password2" class="companySignUp-label required">비밀번호
									확인</label>
								<input type="password" class="form-control companySignUp-input"
									id="companySignUp-password2" placeholder="비밀번호를 다시 입력">
								<small id="companySignUp-pwMsg" class="companySignUp-pwMsg"></small>
							</div>

							<!-- 이름 -->
							<div class="form-group">
								<label for="companySignUp-name" class="companySignUp-label required">이름</label>
								<input type="text" class="form-control companySignUp-input" id="companySignUp-name"
									placeholder="이름">
							</div>

							<!-- 유선전화 -->
							<div class="form-group">
								<label class="companySignUp-label">연락처(유선)</label>
								<div class="companySignUp-inline">
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-telStep1" maxlength="3"
										placeholder="02">
									<span class="companySignUp-sep" aria-hidden="true"></span>
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-telStep1" maxlength="4"
										placeholder="1234">
									<span class="companySignUp-sep" aria-hidden="true"></span>
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-telStep1" maxlength="4"
										placeholder="5678">
								</div>
							</div>

							<!-- 핸드폰 -->
							<div class="form-group">
								<label class="companySignUp-label required">핸드폰번호</label>
								<div class="companySignUp-inline">
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-mobileStep1" maxlength="3"
										placeholder="010">
									<span class="companySignUp-sep" aria-hidden="true"></span>
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-mobileStep1" maxlength="4"
										placeholder="1234">
									<span class="companySignUp-sep" aria-hidden="true"></span>
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-mobileStep1" maxlength="4"
										placeholder="5678">
								</div>
							</div>

							<!-- 이메일 -->
							<div class="form-group">
								<label class="companySignUp-label required">이메일</label>
								<div class="companySignUp-inline">
									<input type="text" class="form-control companySignUp-input"
										id="companySignUp-email-id" placeholder="아이디">
									<span class="companySignUp-atSep" aria-hidden="true">@</span>
									<select id="companySignUp-email-domain-select"
										class="form-control companySignUp-input">
										<option value="">선택</option>
										<option value="gmail.com">gmail.com</option>
										<option value="naver.com">naver.com</option>
										<option value="hanmail.net">hanmail.net</option>
										<option value="daum.net">daum.net</option>
										<option value="nate.com">nate.com</option>
										<option value="yahoo.com">yahoo.com</option>
										<option value="direct">직접입력</option>
									</select>
								</div>
								<div id="companySignUp-email-domain-direct-wrap" class="hidden" style="margin-top:8px;">
									<input type="text" class="form-control companySignUp-input"
										id="companySignUp-email-domain-direct" placeholder="예: mycompany.co.kr">
								</div>
							</div>

							<!-- 주소 -->
							<div class="form-group">
								<label class="companySignUp-label required">주소</label>
								<div class="companySignUp-flex companySignUp-gap10">
									<input type="text" readonly class="form-control companySignUp-input"
										id="companySignUp-a-zipcode" placeholder="우편번호">
									<button type="button" class="btn btn-primary companySignUp-btn companySignUp-eqBtn"
										id="companySignUp-a-addrSearchBtn">주소 검색</button>
								</div>
							</div>
							<div class="form-group">
								<input type="text" readonly class="form-control companySignUp-input"
									id="companySignUp-a-roadAddress" placeholder="도로명주소">
							</div>
							<div class="form-group">
								<input type="text" class="form-control companySignUp-input"
									id="companySignUp-a-detailAddress" placeholder="상세주소(동/호수)">
							</div>

							<div class="form-group" style="margin-top:14px;">
								<button type="button"
									class="btn btn-primary btn-block companySignUp-btn companySignUp-next"
									id="companySignUp-nextBtn">다음 단계</button>
							</div>
						</section>

						<!-- ===== STEP 2: 회사정보 ===== -->
						<section class="companySignUp-section" id="companySignUp-step2" style="display:none;">
							<div class="companySignUp-dividerTitle">기업정보</div>
							<div class="companySignUp-divider"></div>

							<div class="form-group">
								<label class="companySignUp-label required">회사명</label>
								<input type="text" class="form-control companySignUp-input"
									id="companySignUp-companyName" placeholder="회사명">
							</div>
							<div class="form-group">
								<label class="companySignUp-label">담당부서</label>
								<input type="text" class="form-control companySignUp-input" id="companySignUp-dept"
									placeholder="담당부서">
							</div>
							<div class="form-group">
								<label class="companySignUp-label required">대표자</label>
								<input type="text" class="form-control companySignUp-input" id="companySignUp-ceo"
									placeholder="대표자 성명">
							</div>
							<div class="form-group">
								<label class="companySignUp-label required">업태</label>
								<input type="text" class="form-control companySignUp-input" id="companySignUp-bizType"
									placeholder="예: 제조업">
							</div>
							<div class="form-group">
								<label class="companySignUp-label required">업종</label>
								<input type="text" class="form-control companySignUp-input" id="companySignUp-bizItem"
									placeholder="예: 전자부품">
							</div>

							<!-- 회사주소 -->
							<div class="form-group">
								<label class="companySignUp-label required">회사주소</label>
								<div class="companySignUp-flex companySignUp-gap10">
									<input type="text" readonly class="form-control companySignUp-input"
										id="companySignUp-zipcode" placeholder="우편번호">
									<button type="button" class="btn btn-primary companySignUp-btn companySignUp-eqBtn"
										id="companySignUp-addrSearchBtn">주소 검색</button>
								</div>
							</div>
							<div class="form-group"><input type="text" readonly class="form-control companySignUp-input"
									id="companySignUp-roadAddress" placeholder="도로명주소"></div>
							<div class="form-group"><input type="text" class="form-control companySignUp-input"
									id="companySignUp-detailAddress" placeholder="상세주소(동/호수)"></div>

							<div class="form-group">
								<label class="companySignUp-label required">담당자명</label>
								<input type="text" class="form-control companySignUp-input"
									id="companySignUp-managerName" placeholder="담당자명">
							</div>
							<div class="form-group">
								<label class="companySignUp-label required">담당자연락처</label>
								<div class="companySignUp-inline">
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-contact" maxlength="3"
										placeholder="010">
									<span class="companySignUp-sep" aria-hidden="true"></span>
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-contact" maxlength="4"
										placeholder="1234">
									<span class="companySignUp-sep" aria-hidden="true"></span>
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-contact" maxlength="4"
										placeholder="5678">
								</div>
							</div>
							<div class="form-group">
								<label class="companySignUp-label required">기관분류</label>
								<select class="form-control companySignUp-input" id="companySignUp-orgType">
									<option value="">선택</option>
									<option>제조업</option>
									<option>도소매/유통</option>
									<option>서비스</option>
									<option>의료/연구</option>
									<option>교육/공공</option>
									<option>기타</option>
								</select>
							</div>

							<div class="mb-3" style="margin-bottom:3rem;"></div>

							<!-- 세금계산서 발행정보 -->
							<div class="companySignUp-dividerTitle">세금계산서 발행정보</div>
							<div class="companySignUp-divider"></div>

							<div class="form-group">
								<label class="companySignUp-label required">사업자등록번호</label>
								<input type="text" class="form-control companySignUp-input" id="companySignUp-bizNo"
									placeholder="예: 123-45-67890">
							</div>
							<div class="form-group">
								<label class="companySignUp-label">사업자등록증 (1개만 등록)</label>
								<div class="companySignUp-fileRow">
									<input type="file" id="companySignUp-bizRegFile" class="companySignUp-file"
										accept=".jpg,.jpeg,.png,.gif,.pdf,.bmp,.tif,.tiff,.webp">
									<button type="button" class="btn btn-primary companySignUp-btn companySignUp-eqBtn"
										id="companySignUp-bizRegBtn">파일 첨부</button>
									<div class="companySignUp-filePreview" id="companySignUp-filePreview"></div>
								</div>
							</div>
							<div class="form-group">
								<label class="companySignUp-label">회사 대표번호</label>
								<div class="companySignUp-inline">
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-tel" maxlength="3"
										placeholder="02">
									<span class="companySignUp-sep" aria-hidden="true"></span>
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-tel" maxlength="4"
										placeholder="1234">
									<span class="companySignUp-sep" aria-hidden="true"></span>
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-tel" maxlength="4"
										placeholder="5678">
								</div>
							</div>
							<div class="form-group">
								<label class="companySignUp-label">팩스번호</label>
								<div class="companySignUp-inline">
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-fax" maxlength="3"
										placeholder="02">
									<span class="companySignUp-sep" aria-hidden="true"></span>
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-fax" maxlength="4"
										placeholder="1234">
									<span class="companySignUp-sep" aria-hidden="true"></span>
									<input type="text" inputmode="numeric"
										class="form-control companySignUp-input companySignUp-fax" maxlength="4"
										placeholder="5678">
								</div>
							</div>
							<div class="form-group">
								<label class="companySignUp-label required">계산서 발행 이메일</label>
								<div class="companySignUp-inline">
									<input type="text" class="form-control companySignUp-input"
										id="companySignUp-invoice-email-id" placeholder="아이디">
									<span class="companySignUp-atSep" aria-hidden="true">@</span>
									<select id="companySignUp-invoice-email-domain-select"
										class="form-control companySignUp-input">
										<option value="">선택</option>
										<option value="gmail.com">gmail.com</option>
										<option value="naver.com">naver.com</option>
										<option value="hanmail.net">hanmail.net</option>
										<option value="daum.net">daum.net</option>
										<option value="nate.com">nate.com</option>
										<option value="yahoo.com">yahoo.com</option>
										<option value="direct">직접입력</option>
									</select>
								</div>
								<div id="companySignUp-invoice-email-domain-direct-wrap" class="hidden"
									style="margin-top:8px;">
									<input type="text" class="form-control companySignUp-input"
										id="companySignUp-invoice-email-domain-direct" placeholder="예: mycompany.co.kr">
								</div>
							</div>

							<div class="companySignUp-flex companySignUp-gap10" style="margin-top:14px;">
								<button type="button" class="btn btn-default companySignUp-btn companySignUp-eqBtn"
									id="companySignUp-prevBtn">뒤로가기</button>
								<button type="button" class="btn btn-primary companySignUp-btn companySignUp-eqBtn"
									id="companySignUp-submitBtn" style="flex:1;">가입완료</button>
							</div>
						</section>

					</div>
				</div>
			</div>
		</div>

		<footer class="footer-container typefooter-1" th:replace="fragments/front/common :: frontFooter"></footer>
	</div>

	<th:block th:replace="fragments/front/common :: frontScript"></th:block>
	<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
	<script src="/front/js/page/companySignUp.js"></script>
</body>

</html>
