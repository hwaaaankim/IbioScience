<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/front/common :: frontHead"></head>

<body class="common-home res layout-1">
	<div id="wrapper" class="wrapper-fluid banners-effect-3">
		<header id="header" class="typeheader-1" th:replace="fragments/front/common :: frontHeader"></header>

		<div class="main-container container">
			<ul class="breadcrumb">
				<li><a href="/"><i class="fa fa-home"></i></a></li>
				<li><a href="#">회원로그인</a></li>
			</ul>

			<div class="row">
				<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
					<div class="signIn-wrap">
						<h3 class="signIn-title">회원로그인</h3>
						<div class="signIn-divider"></div>

						<!-- ===== 로그인 실패/안내 메시지 영역 ===== -->
						<div th:if="${param.error}" class="alert alert-danger" role="alert" th:text="${param.msg}">로그인
							안내 메시지</div>

						<form id="signIn-form" method="post" action="/signInProcess" class="signIn-form">
							<div class="form-group">
								<label for="signIn-userId" class="signIn-label">아이디</label>
								<input type="text" class="form-control signIn-input" id="signIn-userId" name="username"
									placeholder="아이디를 입력하세요">
							</div>
							<div class="form-group">
								<label for="signIn-password" class="signIn-label">비밀번호</label>
								<input type="password" class="form-control signIn-input" id="signIn-password"
									name="password" placeholder="비밀번호를 입력하세요">
							</div>

							<button type="submit" class="btn btn-primary btn-block signIn-btn signIn-eqBtn"
								id="signIn-submitBtn">로그인</button>

							<!-- 보조 버튼 4개 -->
							<div class="signIn-auxBtns">
								<a href="#" class="btn btn-default signIn-btn-outline">아이디 찾기</a>
								<a href="#" class="btn btn-default signIn-btn-outline">비밀번호 찾기</a>
								<a href="#" class="btn btn-default signIn-btn-outline">법인 회원가입</a>
								<a href="#" class="btn btn-default signIn-btn-outline">개인 회원가입</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

		<footer class="footer-container typefooter-1" th:replace="fragments/front/common :: frontFooter"></footer>
	</div>
	<th:block th:replace="fragments/front/common :: frontScript"></th:block>

</body>
</html>
