<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
	data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="ibioAdminHead(titleText)">

	<meta charset="utf-8" />
	<title th:text="${titleText}">HOME</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta content="#" name="#" />
	<meta content="#" name="#" />
	<link href="/administration/assets/images/favicon.ico" rel="shortcut icon">
	<link href="/administration/assets/libs/jsvectormap/css/jsvectormap.min.css" rel="stylesheet" type="text/css" />
	<link href="/administration/assets/libs/swiper/swiper-bundle.min.css" rel="stylesheet" type="text/css" />
	<link href="/administration/assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
	<link href="/administration/assets/css/icons.min.css" rel="stylesheet" type="text/css" />
	<link href="/administration/assets/css/app.min.css" rel="stylesheet" type="text/css" />
	<link href="/administration/assets/css/custom.min.css" rel="stylesheet" type="text/css" />
	<link href="/administration/assets/css/add.css" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/45.2.0/ckeditor5.css">
	<script src="/administration/assets/js/layout.js"></script>
	<link rel="stylesheet" href="/administration/assets/css/shopManager.css">

</head>

<body>

	<!-- Begin page -->
	<div id="layout-wrapper">

		<header id="page-topbar" th:fragment="ibioAdminHeaderMenu">
			<div class="layout-width">
				<div class="navbar-header">
					<div class="d-flex">
						<div class="navbar-brand-box horizontal-logo">
							<a href="#" class="logo logo-dark">
								ADMIN
							</a>

							<a href="#" class="logo logo-light">
								ADMIN
							</a>
						</div>
					</div>

					<div class="d-flex align-items-center">
						<div class="dropdown ms-sm-3 header-item topbar-user topbar-user-dropdown"
							id="topbarUserDropdown">
							<button type="button" class="btn topbar-user-toggle" id="page-header-user-dropdown"
								aria-haspopup="true" aria-expanded="false" aria-controls="topbar-user-menu">
								<span class="d-flex align-items-center">
									<span class="text-start ms-xl-2">
										<span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text"
											th:text="${#authentication.principal.member.username}">
											사용자아이디
										</span>

										<span class="d-none d-xl-block ms-1 fs-12 user-name-sub-text"
											th:text="${'ROLE_' + #authentication.principal.member.role.name()}">
											ROLE_ADMIN
										</span>
									</span>
								</span>
							</button>

							<div class="dropdown-menu dropdown-menu-end topbar-user-menu" id="topbar-user-menu">
								<a class="dropdown-item"
									th:if="${@adminMenuFacade.canView('/admin/common/memberDetail/' + #authentication.principal.member.id)}"
									th:href="@{/admin/common/memberDetail/{id}(id=${#authentication.principal.member.id})}">
									<i class="mdi mdi-account-circle text-muted fs-16 align-middle me-1"></i>
									<span class="align-middle">내정보</span>
								</a>

								<div class="dropdown-divider"
									th:if="${@adminMenuFacade.canView('/admin/common/memberDetail/' + #authentication.principal.member.id)}">
								</div>

								<a class="dropdown-item" href="/logout">
									<i class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i>
									<span class="align-middle" data-key="t-logout">로그아웃</span>
								</a>
							</div>
						</div>
					</div>

					<script>
						document.addEventListener('DOMContentLoaded', function () {
							const dropdownWrap = document.getElementById('topbarUserDropdown');
							const toggleBtn = document.getElementById('page-header-user-dropdown');
							const menu = document.getElementById('topbar-user-menu');

							if (!dropdownWrap || !toggleBtn || !menu) {
								return;
							}

							function openMenu() {
								dropdownWrap.classList.add('open');
								toggleBtn.setAttribute('aria-expanded', 'true');
								menu.style.maxHeight = menu.scrollHeight + 'px';
							}

							function closeMenu() {
								menu.style.maxHeight = menu.scrollHeight + 'px';
								requestAnimationFrame(function () {
									dropdownWrap.classList.remove('open');
									toggleBtn.setAttribute('aria-expanded', 'false');
									menu.style.maxHeight = '0px';
								});
							}

							function toggleMenu() {
								if (dropdownWrap.classList.contains('open')) {
									closeMenu();
								} else {
									openMenu();
								}
							}

							toggleBtn.addEventListener('click', function (e) {
								e.preventDefault();
								e.stopPropagation();
								toggleMenu();
							});

							menu.addEventListener('click', function (e) {
								e.stopPropagation();
							});

							document.addEventListener('click', function (e) {
								if (!dropdownWrap.contains(e.target)) {
									closeMenu();
								}
							});

							document.addEventListener('keydown', function (e) {
								if (e.key === 'Escape') {
									closeMenu();
								}
							});

							window.addEventListener('resize', function () {
								if (dropdownWrap.classList.contains('open')) {
									menu.style.maxHeight = menu.scrollHeight + 'px';
								}
							});
						});
					</script>
					<style>
						.topbar-user-dropdown {
							position: relative;
						}

						.topbar-user-dropdown .topbar-user-toggle {
							border: 0;
							box-shadow: none;
						}

						.topbar-user-dropdown .topbar-user-toggle:focus {
							box-shadow: none;
						}

						.topbar-user-dropdown .topbar-user-menu {
							display: block;
							top: calc(100% + 8px);
							right: 0;
							left: auto;
							margin-top: 0;
							min-width: 180px;
							padding: 8px 0;
							border-radius: 10px;

							opacity: 0;
							visibility: hidden;
							pointer-events: none;
							transform: translateY(-8px);
							max-height: 0;
							overflow: hidden;

							transition:
								max-height 0.28s ease,
								opacity 0.22s ease,
								transform 0.22s ease,
								visibility 0s linear 0.28s;
						}

						.topbar-user-dropdown.open .topbar-user-menu {
							opacity: 1;
							visibility: visible;
							pointer-events: auto;
							transform: translateY(0);
							transition:
								max-height 0.28s ease,
								opacity 0.22s ease,
								transform 0.22s ease,
								visibility 0s linear 0s;
						}
					</style>
				</div>
			</div>
		</header>

		<div class="app-menu navbar-menu" th:fragment="ibioAdminSideMenu">
			<!-- LOGO -->
			<div class="navbar-brand-box">
				<!-- Dark Logo-->
				<a href="#" class="logo logo-dark">
					ADMIN
				</a>
				<!-- Light Logo-->
				<a href="#" class="logo logo-light">
					ADMIN
				</a>
				<button type="button" class="btn btn-sm p-0 fs-20 header-item float-end btn-vertical-sm-hover"
					id="vertical-hover">
					<i class="ri-record-circle-line"></i>
				</button>
			</div>

			<div id="scrollbar">
				<div class="container-fluid">

					<div id="two-column-menu"></div>

					<!-- ✅ STAFF 전용 관리자 메뉴 -->
					<th:block sec:authorize="isAuthenticated() and authentication.principal.staffPortalUser"
						th:with="adminMenuGroups=${@adminMenuFacade.getVisibleAdminMenuGroups()}">

						<ul class="navbar-nav" id="navbar-nav" th:if="${!#lists.isEmpty(adminMenuGroups)}">
							<li class="menu-title">
								<span data-key="t-menu">Menu</span>
							</li>

							<li class="nav-item" th:each="menuGroup : ${adminMenuGroups}">
								<a class="nav-link menu-link" th:href="${'#' + menuGroup.collapseId}"
									data-bs-toggle="collapse" role="button" aria-expanded="false"
									th:attr="aria-controls=${menuGroup.collapseId}">
									<i th:class="${menuGroup.iconClass}"></i>
									<span data-key="t-dashboards"
										th:text="${'[' + menuGroup.groupName + ']'}">[메뉴그룹]</span>
								</a>

								<div class="collapse menu-dropdown" th:id="${menuGroup.collapseId}">
									<ul class="nav nav-sm flex-column">
										<li class="nav-item" th:each="menu : ${menuGroup.items}">
											<a th:href="${menu.pageUrl}" class="nav-link" data-key="t-ecommerce"
												th:text="${'[' + menu.pageName + ']'}">[메뉴명]</a>
										</li>
									</ul>
								</div>
							</li>
						</ul>
					</th:block>

					<!-- ✅ 판매딜러 전용 사이드메뉴 -->
					<ul class="navbar-nav" id="navbar-nav-seller"
						sec:authorize="isAuthenticated() and authentication.principal.sellerPortalUser">
						<li class="menu-title"><span data-key="t-menu">Seller Menu</span></li>

						<li class="nav-item">
							<a class="nav-link menu-link" href="#sidebarSellerProduct" data-bs-toggle="collapse"
								role="button" aria-expanded="false" aria-controls="sidebarSellerProduct">
								<i class="ri-store-2-line"></i> <span data-key="t-dashboards">[판매상품관리]</span>
							</a>
							<div class="collapse menu-dropdown show" id="sidebarSellerProduct">
								<ul class="nav nav-sm flex-column">
									<li class="nav-item">
										<a href="/seller/page/product/insert" class="nav-link"
											data-key="t-ecommerce">[상품등록]</a>
									</li>
									<li class="nav-item">
										<a href="/seller/page/product/list" class="nav-link"
											data-key="t-ecommerce">[상품리스트]</a>
									</li>
									<li class="nav-item">
										<a href="/seller/productReviewManager" class="nav-link"
											data-key="t-ecommerce">[리뷰관리]</a>
									</li>
									<li class="nav-item">
										<a href="/seller/orderManager" class="nav-link"
											data-key="t-ecommerce">[주문관리]</a>
									</li>
									<li class="nav-item">
										<a href="/seller/settlement/manager" class="nav-link"
											data-key="t-ecommerce">[정산관리]</a>
									</li>
								</ul>
							</div>
						</li>
					</ul>
				</div>
			</div>
			<div class="sidebar-background"></div>
		</div>
	</div>

	<th:block th:fragment="ibioAdminButton">
		<button onclick="topFunction()" class="btn btn-danger btn-icon" id="back-to-top">
			<i class="ri-arrow-up-line"></i>
		</button>

		<div id="preloader">
			<div id="status">
				<div class="spinner-border text-primary avatar-sm" role="status">
					<span class="visually-hidden">로딩중입니다</span>
				</div>
			</div>
		</div>
	</th:block>

	<footer class="footer" th:fragment="ibioAdminFooter">
		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-6">
					<script>document.write(new Date().getFullYear())</script> © IBIOSCIENCE.
				</div>
				<div class="col-sm-6">
					<div class="text-sm-end d-none d-sm-block">
						Design & Develop by IBIOSCIENCE
					</div>
				</div>
			</div>
		</div>
	</footer>

	<th:block th:fragment="ibioAdminScript">
		<script src="/administration/assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
		<script src="/administration/assets/libs/simplebar/simplebar.min.js"></script>
		<script src="/administration/assets/libs/node-waves/waves.min.js"></script>
		<script src="/administration/assets/libs/feather-icons/feather.min.js"></script>
		<script src="/administration/assets/js/pages/plugins/lord-icon-2.1.0.js"></script>
		<script src="/administration/assets/js/plugins.js"></script>

		<script src="/administration/assets/libs/apexcharts/apexcharts.min.js"></script>
		<script src="/administration/assets/libs/jsvectormap/js/jsvectormap.min.js"></script>
		<script src="/administration/assets/libs/jsvectormap/maps/world-merc.js"></script>
		<script src="/administration/assets/libs/swiper/swiper-bundle.min.js"></script>
		<script src="/administration/assets/js/pages/dashboard-ecommerce.init.js"></script>
		<script src="/administration/assets/js/app.js"></script>
	</th:block>

	<div th:fragment="clientDetailInnerMenu(memberId, activeTab)">
		<div class="client-detail-home-inner-menu list-group">
			<a class="list-group-item list-group-item-action"
				th:if="${@adminMenuFacade.canView('/admin/root/clientDetail/' + memberId + '/home')}"
				th:classappend="${activeTab == 'home'} ? ' active' : ''"
				th:href="@{/admin/root/clientDetail/{id}/home(id=${memberId})}">
				CRM 홈
			</a>

			<a class="list-group-item list-group-item-action"
				th:if="${@adminMenuFacade.canView('/admin/root/clientDetail/' + memberId + '/information')}"
				th:classappend="${activeTab == 'information'} ? ' active' : ''"
				th:href="@{/admin/root/clientDetail/{id}/information(id=${memberId})}">
				회원기본정보
			</a>

			<a class="list-group-item list-group-item-action"
				th:if="${@adminMenuFacade.canView('/admin/root/clientDetail/' + memberId + '/orderList')}"
				th:classappend="${activeTab == 'orderList'} ? ' active' : ''"
				th:href="@{/admin/root/clientDetail/{id}/orderList(id=${memberId})}">
				주문내역
			</a>

			<a class="list-group-item list-group-item-action"
				th:if="${@adminMenuFacade.canView('/admin/root/clientDetail/' + memberId + '/reviewList')}"
				th:classappend="${activeTab == 'reviewList'} ? ' active' : ''"
				th:href="@{/admin/root/clientDetail/{id}/reviewList(id=${memberId})}">
				회원리뷰
			</a>

			<a class="list-group-item list-group-item-action"
				th:if="${@adminMenuFacade.canView('/admin/root/clientDetail/' + memberId + '/estimateList')}"
				th:classappend="${activeTab == 'estimateList'} ? ' active' : ''"
				th:href="@{/admin/root/clientDetail/{id}/estimateList(id=${memberId})}">
				견적서문의
			</a>

			<a class="list-group-item list-group-item-action"
				th:if="${@adminMenuFacade.canView('/admin/root/clientDetail/' + memberId + '/benefit')}"
				th:classappend="${activeTab == 'benefit'} ? ' active' : ''"
				th:href="@{/admin/root/clientDetail/{id}/benefit(id=${memberId})}">
				적립금 및 쿠폰
			</a>

			<a class="list-group-item list-group-item-action"
				th:if="${@adminMenuFacade.canView('/admin/root/clientDetail/' + memberId + '/wishList')}"
				th:classappend="${activeTab == 'wishList'} ? ' active' : ''"
				th:href="@{/admin/root/clientDetail/{id}/wishList(id=${memberId})}">
				관심상품열람
			</a>
		</div>
	</div>
</body>

</html>
