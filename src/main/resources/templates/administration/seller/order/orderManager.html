<!doctype html>
<html lang="ko"
      data-layout="vertical"
      data-topbar="light"
      data-sidebar="dark"
      data-sidebar-size="lg"
      data-sidebar-image="none"
      data-preloader="disable"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('딜러 주문관리')}"></head>

<body>
<div id="layout-wrapper">
    <header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
    <div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
    <div class="vertical-overlay"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid">

                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0">딜러 주문관리</h4>
                            <div class="page-title-right">
                                <ol class="breadcrumb m-0">
                                    <li class="breadcrumb-item"><a href="javascript:void(0);">판매딜러</a></li>
                                    <li class="breadcrumb-item active">주문관리</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>

                <style>
                    .seller-order-filter-card .form-label {
                        font-weight: 600;
                        margin-bottom: .45rem;
                    }

                    .seller-order-filter-card .seller-order-check-group {
                        display: flex;
                        flex-wrap: wrap;
                        gap: .6rem 1rem;
                        min-height: 38px;
                        align-items: center;
                    }

                    .seller-order-filter-card .form-check {
                        margin-bottom: 0;
                    }

                    .seller-order-filter-card .seller-order-quick-range {
                        display: flex;
                        flex-wrap: wrap;
                        gap: .5rem;
                    }

                    .seller-order-filter-card .seller-order-quick-range .btn {
                        min-width: 72px;
                        height:38px;
                    }

                    .seller-order-table-card .table > :not(caption) > * > * {
                        vertical-align: middle;
                    }

                    .seller-order-sort-btn {
                        border: 0;
                        background: transparent;
                        padding: 0;
                        font-weight: 600;
                        color: inherit;
                        display: inline-flex;
                        align-items: center;
                        gap: .35rem;
                    }

                    .seller-order-sort-btn .sort-icon {
                        font-size: .8rem;
                        color: #98a6ad;
                    }

                    .seller-order-sort-btn.active .sort-icon {
                        color: #405189;
                    }

                    .seller-order-status-select {
                        min-width: 140px;
                    }

                    .seller-order-clickable-row {
                        cursor: pointer;
                    }

                    .seller-order-clickable-row:hover {
                        background-color: #f8f9fa;
                    }

                    .seller-order-empty {
                        padding: 3rem 1rem;
                        text-align: center;
                        color: #878a99;
                    }

                    .seller-order-pagination-wrap {
                        display: flex;
                        justify-content: center;
                        overflow-x: auto;
                    }

                    .seller-order-pagination-wrap .pagination {
                        flex-wrap: nowrap;
                    }

                    .seller-order-total-text {
                        font-weight: 600;
                    }

                    .seller-order-fixed-input {
                        min-height: 38px;
                    }

                    .seller-order-toolbar {
                        gap: .75rem;
                    }

                    @media (max-width: 991.98px) {
                        .seller-order-filter-card .row > [class^="col-"] {
                            margin-bottom: .85rem;
                        }

                        .seller-order-status-select {
                            min-width: 128px;
                        }

                        .seller-order-table-card .table {
                            min-width: 1280px;
                        }
                    }
                </style>

                <div class="card seller-order-filter-card">
                    <div class="card-body">
                        <form id="seller-order-search-form" autocomplete="off">
                            <div class="row g-3">
                                <div class="col-lg-2 col-md-4">
                                    <label class="form-label" for="seller-order-page-size">페이지 사이즈</label>
                                    <select class="form-select seller-order-fixed-input" id="seller-order-page-size" name="size">
                                        <option value="10">10개</option>
                                        <option value="30">30개</option>
                                        <option value="50">50개</option>
                                        <option value="100">100개</option>
                                    </select>
                                </div>

                                <div class="col-lg-5 col-md-8">
                                    <label class="form-label">주문일자</label>
                                    <div class="row g-2">
                                        <div class="col-sm-5">
                                            <input type="date" class="form-control seller-order-fixed-input" id="seller-order-from-date" name="fromDate">
                                        </div>
                                        <div class="col-sm-2 text-center d-flex align-items-center justify-content-center">
                                            <span>~</span>
                                        </div>
                                        <div class="col-sm-5">
                                            <input type="date" class="form-control seller-order-fixed-input" id="seller-order-to-date" name="toDate">
                                        </div>
                                    </div>
                                </div>

                                <div class="col-lg-5">
                                    <label class="form-label">빠른 날짜 선택</label>
                                    <div class="seller-order-quick-range">
                                        <button type="button" class="btn btn-soft-primary btn-sm seller-order-range-btn" data-range="today">오늘</button>
                                        <button type="button" class="btn btn-soft-primary btn-sm seller-order-range-btn" data-range="7days">7일</button>
                                        <button type="button" class="btn btn-soft-primary btn-sm seller-order-range-btn" data-range="1month">1개월</button>
                                        <button type="button" class="btn btn-soft-secondary btn-sm seller-order-range-btn" data-range="all">전체</button>
                                    </div>
                                </div>

                                <div class="col-lg-3 col-md-4">
                                    <label class="form-label" for="seller-order-keyword-type">검색어 구분</label>
                                    <select class="form-select seller-order-fixed-input" id="seller-order-keyword-type" name="keywordType">
                                        <option value="">선택</option>
                                        <option value="MEMBER_NAME">회원이름</option>
                                        <option value="MEMBER_USERNAME">회원아이디</option>
                                        <option value="COMPANY_NAME">회사명</option>
                                        <option value="CONTACT">연락처</option>
                                        <option value="EMAIL">이메일</option>
                                    </select>
                                </div>

                                <div class="col-lg-9 col-md-8">
                                    <label class="form-label" for="seller-order-keyword">키워드</label>
                                    <input type="text"
                                           class="form-control seller-order-fixed-input"
                                           id="seller-order-keyword"
                                           name="keyword"
                                           placeholder="검색어를 입력해 주세요.">
                                </div>

                                <div class="col-lg-6">
                                    <label class="form-label">주문자 분류</label>
                                    <div class="seller-order-check-group">
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="dealerTypes" value="NONE" id="dealerTypeNone">
                                            <label class="form-check-label" for="dealerTypeNone">일반소비자</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="dealerTypes" value="BUYER" id="dealerTypeBuyer">
                                            <label class="form-check-label" for="dealerTypeBuyer">기업회원</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="dealerTypes" value="SELLER" id="dealerTypeSeller">
                                            <label class="form-check-label" for="dealerTypeSeller">판매딜러</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-lg-6">
                                    <label class="form-label">주문상태</label>
                                    <div class="seller-order-check-group">
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="statuses" value="ORDER_COMPLETED" id="orderStatusCompleted">
                                            <label class="form-check-label" for="orderStatusCompleted">주문완료</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="statuses" value="PRODUCT_PREPARING" id="orderStatusPreparing">
                                            <label class="form-check-label" for="orderStatusPreparing">상품준비중</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="statuses" value="DELIVERING" id="orderStatusDelivering">
                                            <label class="form-check-label" for="orderStatusDelivering">배송중</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="statuses" value="CANCEL_FINISHED" id="orderStatusCancelFinished">
                                            <label class="form-check-label" for="orderStatusCancelFinished">취소완료</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-lg-6">
                                    <label class="form-label">결제수단</label>
                                    <div class="seller-order-check-group">
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="paymentMethods" value="ACCOUNT_TRANSFER" id="paymentAccountTransfer">
                                            <label class="form-check-label" for="paymentAccountTransfer">계좌이체</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="paymentMethods" value="CREDIT_CARD" id="paymentCreditCard">
                                            <label class="form-check-label" for="paymentCreditCard">신용카드</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="paymentMethods" value="PSYS" id="paymentPsys">
                                            <label class="form-check-label" for="paymentPsys">PSYS</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-lg-3">
                                    <label class="form-label">배송방법</label>
                                    <div class="seller-order-check-group">
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="shippingMethods" value="PARCEL" id="shippingParcel">
                                            <label class="form-check-label" for="shippingParcel">택배배송</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="shippingMethods" value="POST" id="shippingPost">
                                            <label class="form-check-label" for="shippingPost">우편배송</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="shippingMethods" value="QUICK" id="shippingQuick">
                                            <label class="form-check-label" for="shippingQuick">퀵/당일</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-lg-3">
                                    <label class="form-label">배송비 구분</label>
                                    <div class="seller-order-check-group">
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="shippingPayTypes" value="PREPAID" id="shippingPayPrepaid">
                                            <label class="form-check-label" for="shippingPayPrepaid">선불</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input seller-order-filter-checkbox" type="checkbox" name="shippingPayTypes" value="COLLECT" id="shippingPayCollect">
                                            <label class="form-check-label" for="shippingPayCollect">착불</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="d-flex justify-content-end seller-order-toolbar">
                                        <button type="button" class="btn btn-light" id="seller-order-reset-btn">초기화</button>
                                        <button type="submit" class="btn btn-primary" id="seller-order-search-btn">검색</button>
                                    </div>
                                </div>
                            </div>

                            <input type="hidden" id="seller-order-sort-field" value="orderedAt">
                            <input type="hidden" id="seller-order-sort-dir" value="desc">
                            <input type="hidden" id="seller-order-page" value="0">
                        </form>
                    </div>
                </div>

                <div class="card seller-order-table-card">
                    <div class="card-body">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                            <div class="seller-order-total-text" id="seller-order-total-text">총 0건</div>
                            <button type="button"
                                    class="btn btn-success"
                                    id="seller-order-save-status-btn"
                                    disabled>
                                상태 저장
                            </button>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-bordered align-middle mb-0">
                                <thead class="table-light">
                                <tr>
                                    <th style="width: 80px;">ID</th>
                                    <th style="width: 180px;">주문번호</th>
                                    <th style="width: 140px;">
                                        <button type="button" class="seller-order-sort-btn" data-sort-field="ordererName">
                                            주문자이름
                                            <span class="sort-icon">↕</span>
                                        </button>
                                    </th>
                                    <th style="width: 150px;">
                                        <button type="button" class="seller-order-sort-btn" data-sort-field="contact">
                                            연락처
                                            <span class="sort-icon">↕</span>
                                        </button>
                                    </th>
                                    <th style="width: 220px;">
                                        <button type="button" class="seller-order-sort-btn" data-sort-field="email">
                                            이메일
                                            <span class="sort-icon">↕</span>
                                        </button>
                                    </th>
                                    <th style="width: 180px;">업체명</th>
                                    <th style="width: 180px;">입점몰명</th>
                                    <th style="width: 150px;">
                                        <button type="button" class="seller-order-sort-btn active" data-sort-field="orderedAt">
                                            주문일
                                            <span class="sort-icon">↕</span>
                                        </button>
                                    </th>
                                    <th style="width: 130px;">
                                        <button type="button" class="seller-order-sort-btn" data-sort-field="status">
                                            주문상태
                                            <span class="sort-icon">↕</span>
                                        </button>
                                    </th>
                                    <th style="width: 160px;">상태변경</th>
                                </tr>
                                </thead>
                                <tbody id="seller-order-table-body">
                                <tr>
                                    <td colspan="10" class="seller-order-empty">조회 중입니다.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="seller-order-pagination-wrap mt-4">
                            <nav>
                                <ul class="pagination pagination-separated mb-0" id="seller-order-pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/administration/assets/seller/order/orderManager.js"></script>
</body>
</html>
