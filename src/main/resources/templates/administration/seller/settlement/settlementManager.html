<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
	data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('딜러정산관리')}"></head>

<body>
	<div id="layout-wrapper">
		<header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
		<div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
		<div class="vertical-overlay"></div>

		<style>
			.seller-settlement-manager-table-scroll::-webkit-scrollbar,
			.seller-settlement-manager-order-table-scroll::-webkit-scrollbar {
				height: 10px;
			}

			.seller-settlement-manager-table-scroll::-webkit-scrollbar-thumb,
			.seller-settlement-manager-order-table-scroll::-webkit-scrollbar-thumb {
				background: #cfd6dd;
				border-radius: 999px;
			}

			.seller-settlement-manager-table-scroll::-webkit-scrollbar-track,
			.seller-settlement-manager-order-table-scroll::-webkit-scrollbar-track {
				background: #f5f6f8;
			}

			.seller-settlement-manager-table th,
			.seller-settlement-manager-table td,
			.seller-settlement-manager-order-table th,
			.seller-settlement-manager-order-table td {
				white-space: nowrap;
				vertical-align: middle;
			}

			.seller-settlement-manager-order-memo-cell {
				white-space: normal !important;
				word-break: break-word;
				text-align: left;
				min-width: 280px;
				max-width: 360px;
				line-height: 1.5;
			}
		</style>

		<div class="main-content">
			<div class="page-content">
				<div class="container-fluid" id="seller-settlement-manager-page-root">

					<div class="row">
						<div class="col-12">
							<div class="page-title-box d-sm-flex align-items-center justify-content-between">
								<h4 class="mb-sm-0">딜러정산관리</h4>
								<div class="page-title-right">
									<ol class="breadcrumb m-0">
										<li class="breadcrumb-item"><a href="javascript:void(0);">딜러정산관리</a></li>
										<li class="breadcrumb-item active">딜러정산관리</li>
									</ol>
								</div>
							</div>
						</div>
					</div>

					<!-- 필터 -->
					<div class="card seller-settlement-manager-filter-card border-0 shadow-sm">
						<div class="card-body">
							<div class="row g-3 align-items-end">

								<div class="col-12 col-md-6 col-lg-2">
									<label for="seller-settlement-manager-page-size"
										class="form-label fw-semibold mb-2">페이지 사이즈</label>
									<select id="seller-settlement-manager-page-size"
										class="form-select seller-settlement-manager-form-control"
										style="height: 44px;">
										<option value="10" selected>10개</option>
										<option value="30">30개</option>
										<option value="50">50개</option>
										<option value="100">100개</option>
									</select>
								</div>

								<div class="col-12 col-md-6 col-lg-3">
									<label for="seller-settlement-manager-from-date"
										class="form-label fw-semibold mb-2">기간 시작일</label>
									<input type="date" id="seller-settlement-manager-from-date"
										class="form-control seller-settlement-manager-form-control"
										style="height: 44px;">
								</div>

								<div class="col-12 col-md-6 col-lg-3">
									<label for="seller-settlement-manager-to-date"
										class="form-label fw-semibold mb-2">기간 종료일</label>
									<input type="date" id="seller-settlement-manager-to-date"
										class="form-control seller-settlement-manager-form-control"
										style="height: 44px;">
								</div>

								<div class="col-12 col-md-6 col-lg-4">
									<div class="d-flex justify-content-lg-end gap-2">
										<button type="button" id="seller-settlement-manager-search-btn"
											class="btn btn-primary seller-settlement-manager-action-btn"
											style="height: 44px; min-width: 120px;">
											조회
										</button>
										<button type="button" id="seller-settlement-manager-reset-btn"
											class="btn btn-light border seller-settlement-manager-action-btn"
											style="height: 44px; min-width: 120px;">
											초기화
										</button>
									</div>
								</div>

							</div>
						</div>
					</div>

					<!-- 리스트 -->
					<div class="card seller-settlement-manager-list-card border-0 shadow-sm">
						<div class="card-body">

							<div
								class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
								<div class="d-flex align-items-center gap-2">
									<h5 class="card-title mb-0 fw-bold">정산 내역</h5>
									<span id="seller-settlement-manager-total-count-badge"
										class="badge bg-primary-subtle text-primary-emphasis rounded-pill px-3 py-2">
										총 0건
									</span>
								</div>
								<div id="seller-settlement-manager-result-period-text"
									class="text-muted small text-md-end">
									전체 기간
								</div>
							</div>

							<div class="seller-settlement-manager-table-outer"
								style="border: 1px solid #e9ebec; border-radius: 0.75rem; overflow: hidden; background: #fff;">
								<div class="seller-settlement-manager-table-scroll"
									style="overflow-x: auto; overflow-y: hidden; width: 100%; -webkit-overflow-scrolling: touch;">
									<table class="table align-middle mb-0 text-center seller-settlement-manager-table"
										style="min-width: 1900px; table-layout: fixed; margin-bottom: 0;">
										<thead class="table-light">
											<tr>
												<th style="min-width: 80px; white-space: nowrap;">정산ID</th>
												<th style="min-width: 180px; white-space: nowrap;">정산기간</th>
												<th style="min-width: 120px; white-space: nowrap;">정산기준</th>
												<th style="min-width: 120px; white-space: nowrap;">정산주기</th>
												<th style="min-width: 110px; white-space: nowrap;">주문건수</th>
												<th style="min-width: 110px; white-space: nowrap;">상품수량</th>
												<th style="min-width: 140px; white-space: nowrap;">총주문금액</th>
												<th style="min-width: 100px; white-space: nowrap;">수수료율</th>
												<th style="min-width: 140px; white-space: nowrap;">수수료</th>
												<th style="min-width: 140px; white-space: nowrap;">실정산액</th>
												<th style="min-width: 110px; white-space: nowrap;">상태</th>
												<th style="min-width: 170px; white-space: nowrap;">정산생성일시</th>
												<th style="min-width: 170px; white-space: nowrap;">지급일시</th>
												<th style="min-width: 130px; white-space: nowrap;">상세주문</th>
											</tr>
										</thead>
										<tbody id="seller-settlement-manager-tbody">
											<tr>
												<td colspan="14" class="py-5 text-muted" style="white-space: nowrap;">
													조회된 데이터가 없습니다.
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>

							<div
								class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 mt-4">
								<div id="seller-settlement-manager-page-info" class="text-muted small">
									0 / 0 페이지
								</div>

								<nav aria-label="seller settlement pagination">
									<ul id="seller-settlement-manager-pagination"
										class="pagination pagination-sm mb-0 seller-settlement-manager-pagination">
									</ul>
								</nav>
							</div>

						</div>
					</div>

				</div>
			</div>

			<footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
		</div>
	</div>

	<!-- 상세주문 모달 -->
	<div class="modal fade" id="seller-settlement-manager-order-modal" tabindex="-1"
		aria-labelledby="seller-settlement-manager-order-modal-label" aria-hidden="true">
		<div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
			<div class="modal-content border-0 shadow">
				<div class="modal-header">
					<h5 class="modal-title fw-bold" id="seller-settlement-manager-order-modal-label">정산 상세주문</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
				</div>
				<div class="modal-body">

					<div class="row g-3 mb-4">
						<div class="col-12 col-lg-6">
							<div class="border rounded-3 p-3 h-100 bg-light-subtle">
								<div class="fw-semibold mb-2">정산 기본정보</div>
								<div id="seller-settlement-manager-order-summary-left" class="small text-muted"></div>
							</div>
						</div>
						<div class="col-12 col-lg-6">
							<div class="border rounded-3 p-3 h-100 bg-light-subtle">
								<div class="fw-semibold mb-2">금액 정보</div>
								<div id="seller-settlement-manager-order-summary-right" class="small text-muted"></div>
							</div>
						</div>
					</div>

					<div style="border: 1px solid #e9ebec; border-radius: 0.75rem; overflow: hidden;">
						<div class="seller-settlement-manager-order-table-scroll"
							style="overflow-x: auto; overflow-y: hidden; width: 100%; -webkit-overflow-scrolling: touch;">
							<table class="table align-middle mb-0 text-center seller-settlement-manager-order-table"
								style="min-width: 1700px; table-layout: fixed; margin-bottom: 0;">
								<thead class="table-light">
									<tr>
										<th style="min-width: 100px;">주문ID</th>
										<th style="min-width: 170px;">주문번호</th>
										<th style="min-width: 140px;">주문자</th>
										<th style="min-width: 180px;">기준일시</th>
										<th style="min-width: 140px;">주문상태</th>
										<th style="min-width: 120px;">딜러상품수량</th>
										<th style="min-width: 150px;">딜러상품금액</th>
										<th style="min-width: 140px;">주문별수수료</th>
										<th style="min-width: 150px;">주문별실정산액</th>
										<th style="min-width: 320px;">관리자메모</th>
									</tr>
								</thead>
								<tbody id="seller-settlement-manager-order-tbody">
									<tr>
										<td colspan="10" class="py-5 text-muted">불러오는 중입니다.</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>

				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-light border" data-bs-dismiss="modal">닫기</button>
				</div>
			</div>
		</div>
	</div>

	<!-- 로딩 -->
	<div id="seller-settlement-manager-loading" class="d-none position-fixed top-0 start-0 w-100 h-100"
		style="background: rgba(255,255,255,0.65); z-index: 2000;">
		<div class="d-flex flex-column justify-content-center align-items-center w-100 h-100">
			<div class="spinner-border text-primary" role="status"></div>
			<div class="mt-3 fw-semibold text-dark">데이터를 불러오는 중입니다.</div>
		</div>
	</div>

	<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
	<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/administration/assets/seller/settlement/settlementManager.js"></script>
</body>

</html>
