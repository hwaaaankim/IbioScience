<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
	data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('직원정보상세')}"></head>

<body>
	<div id="layout-wrapper">
		<header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
		<div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
		<div class="vertical-overlay"></div>

		<div class="main-content">
			<div class="page-content">
				<div class="container-fluid">

					<!-- Title / Breadcrumb -->
					<div class="row">
						<div class="col-12">
							<div class="page-title-box d-sm-flex align-items-center justify-content-between">
								<h4 class="mb-sm-0">직원정보상세</h4>
								<div class="page-title-right">
									<ol class="breadcrumb m-0">
										<li class="breadcrumb-item"><a href="javascript:void(0);">관리</a></li>
										<li class="breadcrumb-item active">직원정보상세</li>
									</ol>
								</div>
							</div>
						</div>
					</div>

					<div class="card">
						<div class="card-body">

							<form id="member-detail-form" th:action="@{/admin/common/memberUpdate}" method="post"
								th:object="${form}">

								<input type="hidden" th:field="*{id}" />

								<!-- 1행: 권한 / 담당자명 -->
								<div class="row g-3 mb-0 member-insertForm-row">
									<!-- 권한: ROOT/MASTER만 활성 (단, ROOT 본인은 비활성) -->
									<div class="col-lg-6 member-insertForm-col">
										<div class="member-insertForm-field">
											<label class="form-label">권한</label>
											<select class="form-select" name="role" th:disabled="${!canChangeRole}"
												th:with="currentRole=${form.role != null ? form.role.name() : null}">
												<option value="ROOT" th:selected="${currentRole == 'ROOT'}" disabled>루트
												</option>
												<option value="MASTER" th:selected="${currentRole == 'MASTER'}">마스터
												</option>
												<option value="OPERATOR" th:selected="${currentRole == 'OPERATOR'}">
													운영관리자</option>
												<option value="ADMIN" th:selected="${currentRole == 'ADMIN'}">일반관리자
												</option>
											</select>
											<div class="text-muted small"
												th:text="${isRoot and isSelf} ? '루트는 자신의 권한을 변경할 수 없습니다.' : '루트/마스터만 변경 가능합니다.'">
												루트/마스터만 변경 가능합니다.
											</div>
										</div>
									</div>

									<!-- 담당자명: self만 활성 -->
									<div class="col-lg-6 member-insertForm-col">
										<div class="member-insertForm-field">
											<label class="form-label">담당자명</label>
											<input type="text" class="form-control" th:field="*{name}"
												th:readonly="${!isSelf}">
										</div>
									</div>
								</div>

								<!-- 2행: 아이디 / 비밀번호 변경 -->
								<div class="row g-3 member-insertForm-row">
									<div class="col-lg-6 member-insertForm-col">
										<div class="member-insertForm-field">
											<label class="form-label">아이디</label>
											<div class="input-group">
												<input type="text" class="form-control" th:field="*{username}"
													th:readonly="${!isSelf}" maxlength="30" autocomplete="off"
													placeholder="영문/숫자 4~30자">
												<button class="btn btn-outline-primary" type="button"
													id="member-detail-idCheckBtn" th:disabled="${!isSelf}">중복체크</button>
											</div>
											<div class="form-text" id="member-detail-idCheckResult">아이디 중복여부를 확인해 주세요.
											</div>
										</div>
									</div>

									<div class="col-lg-6 member-insertForm-col">
										<div class="member-insertForm-field">
											<label class="form-label">비밀번호 변경</label>
											<input type="password" class="form-control" th:field="*{password}"
												th:readonly="${!isSelf}" placeholder="변경 시에만 입력 (8자 이상)">
											<div class="text-muted small">본인 변경 시에만 최초로그인 플래그가 해제됩니다.</div>
										</div>
									</div>
								</div>

								<!-- 3행: 직급/직책 / 유선번호 -->
								<div class="row g-3 member-insertForm-row">
									<div class="col-lg-6 member-insertForm-col">
										<div class="member-insertForm-field">
											<label class="form-label">직급/직책</label>
											<input type="text" class="form-control" th:field="*{position}"
												th:readonly="${!isSelf}">
										</div>
									</div>

									<div class="col-lg-6 member-insertForm-col">
										<div class="member-insertForm-field">
											<label class="form-label">유선번호</label>
											<input type="text" class="form-control" th:field="*{tel}"
												th:readonly="${!isSelf}" placeholder="예) 02-1234-5678">
										</div>
									</div>
								</div>

								<!-- 4행: 휴대폰번호 / 이메일 -->
								<div class="row g-3 member-insertForm-row">
									<div class="col-lg-6 member-insertForm-col">
										<div class="member-insertForm-field">
											<label class="form-label">휴대폰번호</label>
											<input type="text" class="form-control" th:field="*{mobile}"
												th:readonly="${!isSelf}" placeholder="예) 010-1234-5678">
										</div>
									</div>

									<div class="col-lg-6 member-insertForm-col">
										<div class="member-insertForm-field">
											<label class="form-label">이메일</label>
											<input type="email" class="form-control" th:field="*{email}"
												th:readonly="${!isSelf}">
										</div>
									</div>
								</div>

								<!-- 5행: 대표여부 / 사용여부 (ROOT/MASTER만) -->
								<!-- 5행: 대표여부 / 사용여부 (ROOT/MASTER만 변경 가능) -->
								<div class="row g-3 member-insertForm-row">
									<div class="col-lg-6 member-insertForm-col">
										<div class="member-insertForm-field">
											<label class="form-label">대표여부</label>
											<div class="form-check form-switch mb-0">
												<!-- canManage 가 false 면 체크값은 보여주되 수정 불가 -->
												<input class="form-check-input" type="checkbox" th:field="*{isPrimary}"
													th:disabled="${!canManage}">
												<label class="form-check-label">대표 담당자 지정</label>
											</div>
											<div class="text-muted small">루트/마스터만 변경 가능합니다.</div>
										</div>
									</div>

									<div class="col-lg-6 member-insertForm-col">
										<div class="member-insertForm-field">
											<label class="form-label">사용여부</label>
											<div class="form-check form-switch mb-0">
												<input class="form-check-input" type="checkbox" th:field="*{useYn}"
													th:disabled="${!canManage}">
												<label class="form-check-label">계정 사용</label>
											</div>
											<div class="text-muted small">루트/마스터만 변경 가능합니다.</div>
										</div>
									</div>
								</div>

								<!-- 버튼 -->
								<div class="row mt-3">
									<div class="col-12 d-flex gap-2">
										<button type="submit" class="btn btn-primary">저장</button>
										<a th:href="@{/admin/common/memberDetail/{id}(id=${member.id})}"
											class="btn btn-light">되돌리기</a>
									</div>
								</div>

							</form>
						</div>
					</div>

				</div>
			</div>

			<footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
		</div>
	</div>

	<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
	<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/administration/assets/js/page/shopManager/memberDetail.js"></script>
</body>

</html>
