<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
	data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('고객회원관리상세')}"></head>

<body>
	<div id="layout-wrapper">
		<header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
		<div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
		<div class="vertical-overlay"></div>

		<div class="main-content">
			<div class="page-content">
				<div class="container-fluid">

					<div class="row">
						<div class="col-12">
							<div class="page-title-box d-sm-flex align-items-center justify-content-between">
								<h4 class="mb-sm-0">고객회원관리상세</h4>
								<div class="page-title-right">
									<ol class="breadcrumb m-0">
										<li class="breadcrumb-item"><a href="javascript:void(0);">관리</a></li>
										<li class="breadcrumb-item active">쿠폰 및 적립금</li>
									</ol>
								</div>
							</div>
						</div>
					</div>

					<div class="row">
						<div class="col-xl-2 col-lg-3 col-md-4">
							<div class="card">
								<div class="card-body">
									<div
										th:replace="~{fragments/administration/common :: clientDetailInnerMenu(${memberId}, ${activeTab})}">
									</div>
								</div>
							</div>
						</div>

						<div class="col-xl-10 col-lg-9 col-md-8">
							<div class="card">
								<div class="card-body">

									<style>
										.client-detail-benefitManager-section-title {
											font-size: 1rem;
											font-weight: 700;
											margin-bottom: .25rem;
										}

										.client-detail-benefitManager-point-current {
											font-size: 1.75rem;
											font-weight: 800;
											color: #405189;
										}

										.client-detail-benefitManager-divider {
											border-top: 1px solid #e9ebec;
											margin: 2rem 0;
										}

										.client-detail-benefitManager-pagination {
											display: flex;
											gap: .375rem;
											flex-wrap: wrap;
											justify-content: center;
											margin-top: 1rem;
										}

										.client-detail-benefitManager-pagination .btn {
											min-width: 40px;
										}

										.client-detail-benefitManager-status-wrap {
											display: flex;
											flex-wrap: wrap;
											gap: 1rem;
											align-items: center;
										}

										.client-detail-benefitManager-empty-row {
											text-align: center;
											color: #878a99;
											padding: 2rem 0 !important;
										}
									</style>

									<!-- 적립금 관리 -->
									<div class="client-detail-benefitManager-point-section">
										<div
											class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
											<div>
												<div class="client-detail-benefitManager-section-title">적립금 관리</div>
												<div class="text-muted mb-2">현재 적립금</div>
												<div class="client-detail-benefitManager-point-current">
													<span id="client-detail-benefitManager-current-point">0</span> P
												</div>
											</div>

											<div class="row g-2 align-items-end">
												<div class="col-auto">
													<label class="form-label mb-1"
														for="client-detail-benefitManager-point-from">From</label>
													<input type="date" class="form-control"
														id="client-detail-benefitManager-point-from">
												</div>
												<div class="col-auto">
													<label class="form-label mb-1"
														for="client-detail-benefitManager-point-to">To</label>
													<input type="date" class="form-control"
														id="client-detail-benefitManager-point-to">
												</div>
												<div class="col-auto">
													<button type="button" class="btn btn-primary"
														id="client-detail-benefitManager-point-search-btn">내역보기</button>
												</div>
											</div>
										</div>

										<div class="row g-2 align-items-end mb-4">
											<div class="col-md-4 col-lg-3">
												<label class="form-label mb-1"
													for="client-detail-benefitManager-point-amount">적립금 금액</label>
												<input type="number" min="1" step="1" class="form-control"
													id="client-detail-benefitManager-point-amount" placeholder="숫자만 입력">
											</div>
											<div class="col-auto">
												<button type="button" class="btn btn-outline-danger"
													id="client-detail-benefitManager-point-deduct-btn">- 차감</button>
											</div>
											<div class="col-auto">
												<button type="button" class="btn btn-success"
													id="client-detail-benefitManager-point-grant-btn">+ 부여</button>
											</div>
										</div>

										<div class="table-responsive">
											<table class="table table-bordered table-nowrap align-middle mb-0">
												<thead class="table-light">
													<tr>
														<th style="width: 110px;">구분</th>
														<th style="width: 140px;">금액</th>
														<th style="width: 180px;">주문번호</th>
														<th>처리유형</th>
														<th style="width: 180px;">일시</th>
													</tr>
												</thead>
												<tbody id="client-detail-benefitManager-point-tbody"></tbody>
											</table>
										</div>

										<div id="client-detail-benefitManager-point-pagination"
											class="client-detail-benefitManager-pagination"></div>
									</div>

									<div class="client-detail-benefitManager-divider"></div>

									<!-- 쿠폰 관리 -->
									<div class="client-detail-benefitManager-coupon-section">
										<div
											class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
											<div>
												<div class="client-detail-benefitManager-section-title">쿠폰 관리</div>
												<div class="text-muted">기간 및 상태로 검색할 수 있습니다.</div>
											</div>
										</div>

										<div class="row g-2 align-items-end mb-3">
											<div class="col-md-3 col-lg-2">
												<label class="form-label mb-1"
													for="client-detail-benefitManager-coupon-from">From</label>
												<input type="date" class="form-control"
													id="client-detail-benefitManager-coupon-from">
											</div>
											<div class="col-md-3 col-lg-2">
												<label class="form-label mb-1"
													for="client-detail-benefitManager-coupon-to">To</label>
												<input type="date" class="form-control"
													id="client-detail-benefitManager-coupon-to">
											</div>
											<div class="col-md-6 col-lg-6">
												<label class="form-label mb-1">쿠폰 상태</label>
												<div class="client-detail-benefitManager-status-wrap" style="height:37.5px;">
													<label class="form-check-label"
														th:each="status : ${couponStatuses}">
														<input
															class="form-check-input me-1 client-detail-benefitManager-coupon-status"
															type="checkbox" th:value="${status}">
														<span th:text="${status.label}">상태</span>
													</label>
												</div>
											</div>
											<div class="col-auto">
												<button type="button" class="btn btn-primary"
													id="client-detail-benefitManager-coupon-search-btn">검색</button>
											</div>
										</div>

										<div class="table-responsive">
											<table class="table table-bordered table-nowrap align-middle mb-0">
												<thead class="table-light">
													<tr>
														<th>쿠폰명</th>
														<th style="width: 220px;">사용가능기간</th>
														<th style="width: 120px;">상태</th>
														<th style="width: 250px;">발급경로</th>
														<th style="width: 180px;">사용주문</th>
														<th style="width: 110px;">삭제</th>
													</tr>
												</thead>
												<tbody id="client-detail-benefitManager-coupon-tbody"></tbody>
											</table>
										</div>

										<div id="client-detail-benefitManager-coupon-pagination"
											class="client-detail-benefitManager-pagination"></div>
									</div>

									<div class="client-detail-benefitManager-divider"></div>

									<!-- 쿠폰 증정 -->
									<div class="client-detail-benefitManager-coupon-grant-section">
										<div class="client-detail-benefitManager-section-title mb-3">쿠폰 증정</div>

										<div class="row g-3">
											<div class="col-md-4 col-lg-3">
												<label class="form-label"
													for="client-detail-benefitManager-grant-coupon-code">쿠폰코드</label>
												<input type="text" class="form-control"
													id="client-detail-benefitManager-grant-coupon-code"
													placeholder="중복 불가">
											</div>

											<div class="col-md-4 col-lg-3">
												<label class="form-label"
													for="client-detail-benefitManager-grant-coupon-name">쿠폰명</label>
												<input type="text" class="form-control"
													id="client-detail-benefitManager-grant-coupon-name">
											</div>

											<div class="col-md-4 col-lg-2">
												<label class="form-label"
													for="client-detail-benefitManager-grant-min-purchase">최소
													구매금액</label>
												<input type="number" min="0" step="0.01" class="form-control"
													id="client-detail-benefitManager-grant-min-purchase" value="0">
											</div>

											<div class="col-md-4 col-lg-2">
												<label class="form-label"
													for="client-detail-benefitManager-grant-coupon-amount">쿠폰금액</label>
												<input type="number" min="0" step="0.01" class="form-control"
													id="client-detail-benefitManager-grant-coupon-amount" value="0">
											</div>

											<div class="col-md-4 col-lg-2">
												<label class="form-label"
													for="client-detail-benefitManager-grant-policy">쿠폰정책</label>
												<select class="form-select"
													id="client-detail-benefitManager-grant-policy">
													<option value="">선택</option>
													<option th:each="policy : ${couponPolicies}" th:value="${policy}"
														th:text="${policy}">정책</option>
												</select>
											</div>

											<div class="col-md-4 col-lg-2">
												<label class="form-label"
													for="client-detail-benefitManager-grant-start-date">시작일</label>
												<input type="date" class="form-control"
													id="client-detail-benefitManager-grant-start-date">
											</div>

											<div class="col-md-4 col-lg-2">
												<label class="form-label"
													for="client-detail-benefitManager-grant-end-date">종료일</label>
												<input type="date" class="form-control"
													id="client-detail-benefitManager-grant-end-date">
											</div>

											<div class="col-12">
												<button type="button" class="btn btn-success"
													id="client-detail-benefitManager-grant-coupon-btn">쿠폰 부여</button>
											</div>
										</div>
									</div>

								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
		</div>
	</div>

	<div class="modal fade" id="client-detail-benefitManager-coupon-source-modal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">쿠폰 발급/사용 상세</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
				</div>
				<div class="modal-body" id="client-detail-benefitManager-coupon-source-modal-body"></div>
			</div>
		</div>
	</div>

	<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
	<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>

	<script th:inline="javascript">
		/*<![CDATA[*/
		window.CLIENT_DETAIL_BENEFIT_MANAGER_MEMBER_ID = /*[[${memberId}]]*/ null;
	/*]]>*/
	</script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/administration/assets/js/page/clientManager/detail/clientDetailBenefit.js"></script>
</body>

</html>
