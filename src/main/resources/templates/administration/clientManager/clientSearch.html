<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
	data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('고객회원관리')}"></head>

<body>
	<div id="layout-wrapper">
		<header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
		<div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
		<div class="vertical-overlay"></div>

		<div class="main-content">
			<div class="page-content">
				<div class="container-fluid">

					<!-- Title / Breadcrumb -->
					<div class="row">
						<div class="col-12">
							<div class="page-title-box d-sm-flex align-items-center justify-content-between">
								<h4 class="mb-sm-0">회원관리</h4>
								<div class="page-title-right">
									<ol class="breadcrumb m-0">
										<li class="breadcrumb-item"><a href="javascript:void(0);">관리</a></li>
										<li class="breadcrumb-item active">고객회원 조회</li>
									</ol>
								</div>
							</div>
						</div>
					</div>

					<!-- Filter Card -->
					<div class="card">
						<div class="card-body">
							<form id="client-search-form" th:action="@{/admin/root/clientSearch}" method="get"
								class="row g-3">

								<!-- page / sort -->
								<input type="hidden" name="page" th:value="${cond.page != null ? cond.page : 0}" />
								<input type="hidden" name="sortKey" th:value="${sortKey}" />
								<input type="hidden" name="sortDir" th:value="${sortDir}" />

								<!-- Row 1 -->
								<div class="col-md-2">
									<label class="form-label">페이지 사이즈</label>
									<select class="form-select" name="size" id="client-size">
										<option value="10" th:selected="${cond.size == 10}">10</option>
										<option value="30" th:selected="${cond.size == 30}">30</option>
										<option value="50" th:selected="${cond.size == 50}">50</option>
										<option value="100" th:selected="${cond.size == 100}">100</option>
									</select>
								</div>

								<div class="col-md-2">
									<label class="form-label">검색 필드</label>
									<select class="form-select" name="searchField" id="client-search-field">
										<option value=""
											th:selected="${cond.searchField == null || cond.searchField == ''}">전체
										</option>
										<option th:each="sf : ${searchFieldOptions}" th:value="${sf.value}"
											th:selected="${cond.searchField == sf.value}" th:text="${sf.label}">
										</option>
									</select>
								</div>

								<div class="col-md-3">
									<label class="form-label">검색어</label>
									<input class="form-control" type="text" name="keyword" id="client-keyword"
										th:value="${cond.keyword}" placeholder="검색어 입력" />
								</div>

								<!-- ✅ 체크박스 수직 중앙정렬용 class 추가 (client-search- 접두사) -->
								<div class="col-md-3 client-search-membertype-col">
									<label class="form-label d-block client-search-membertype-label">회원분류(다중선택)</label>
									<div
										class="d-flex flex-wrap gap-3 mt-1 align-items-center client-search-membertype-wrap">
										<div
											class="form-check d-flex align-items-center mb-0 client-search-membertype-item">
											<input
												class="form-check-input client-member-type client-search-membertype-check"
												type="checkbox" id="type-general" name="memberTypes" value="GENERAL"
												th:checked="${#lists.contains(selectedMemberTypes, 'GENERAL')}">
											<label class="form-check-label ms-1 client-search-membertype-text"
												for="type-general">일반회원</label>
										</div>

										<div
											class="form-check d-flex align-items-center mb-0 client-search-membertype-item">
											<input
												class="form-check-input client-member-type client-search-membertype-check"
												type="checkbox" id="type-company-buyer" name="memberTypes"
												value="COMPANY_BUYER"
												th:checked="${#lists.contains(selectedMemberTypes, 'COMPANY_BUYER')}">
											<label class="form-check-label ms-1 client-search-membertype-text"
												for="type-company-buyer">기업회원(구매만)</label>
										</div>

										<div
											class="form-check d-flex align-items-center mb-0 client-search-membertype-item">
											<input
												class="form-check-input client-member-type client-search-membertype-check"
												type="checkbox" id="type-company-seller" name="memberTypes"
												value="COMPANY_SELLER"
												th:checked="${#lists.contains(selectedMemberTypes, 'COMPANY_SELLER')}">
											<label class="form-check-label ms-1 client-search-membertype-text"
												for="type-company-seller">기업회원(판매가능)</label>
										</div>
									</div>
								</div>

								<!-- 딜러등급 -->
								<div class="col-md-2">
									<label class="form-label">딜러등급</label>
									<select class="form-select" name="grade" id="client-grade">
										<option th:each="g : ${dealerGradeOptions}" th:value="${g}"
											th:selected="${cond.grade != null ? (cond.grade.name() == g) : (g == 'ALL')}"
											th:text="${g}">
										</option>
									</select>
								</div>

								<!-- Row 2 -->
								<div class="col-md-2">
									<label class="form-label">멤버 상태</label>
									<select class="form-select" name="status" id="client-status">
										<option value="" th:selected="${cond.status == null}">전체</option>
										<option th:each="st : ${memberStatusList}" th:value="${st.name()}"
											th:selected="${cond.status != null && cond.status.name() == st.name()}"
											th:text="${st.name()}">
										</option>
									</select>
								</div>

								<div class="col-md-2">
									<label class="form-label">날짜 기준</label>
									<select class="form-select" name="dateField" id="client-date-field">
										<option value="JOINED"
											th:selected="${cond.dateField == null || cond.dateField.name() == 'JOINED'}">
											가입일</option>
										<option value="WITHDREW"
											th:selected="${cond.dateField != null && cond.dateField.name() == 'WITHDREW'}">
											탈퇴일</option>
									</select>
								</div>

								<div class="col-md-3">
									<label class="form-label">From</label>
									<input class="form-control" type="date" name="from" id="client-from"
										th:value="${cond.from}" />
								</div>

								<div class="col-md-3">
									<label class="form-label">To</label>
									<input class="form-control" type="date" name="to" id="client-to"
										th:value="${cond.to}" />
								</div>

								<div class="col-md-2 d-flex align-items-end">
									<div class="d-flex gap-2 w-100">
										<button type="submit" class="btn btn-primary flex-fill">조회</button>
										<a class="btn btn-light flex-fill" th:href="@{/admin/root/clientSearch}">초기화</a>
									</div>
								</div>
							</form>
						</div>
					</div>

					<!-- Result Card -->
					<div class="card">
						<div class="card-body">
							<div class="d-flex align-items-center justify-content-between mb-3">
								<div>
									<span class="fw-semibold">총 회원 수 : </span>
									<span class="fw-bold text-primary" th:text="${totalCount}">0</span>
								</div>
							</div>

							<div class="table-responsive">
								<table class="table table-bordered table-hover align-middle">
									<thead class="table-light">
										<tr>
											<th style="width:36px; text-align:center;">
												<input type="checkbox" id="client-check-all" />
											</th>

											<th class="client-sortable" data-sort-key="joinedAt"
												style="min-width:120px;">
												가입일 <span class="client-sort-icons">▲▼</span>
											</th>
											<th class="client-sortable" data-sort-key="name" style="min-width:120px;">
												이름 <span class="client-sort-icons">▲▼</span>
											</th>
											<th class="client-sortable" data-sort-key="username"
												style="min-width:140px;">
												아이디 <span class="client-sort-icons">▲▼</span>
											</th>
											<th class="client-sortable" data-sort-key="memberGrade"
												style="min-width:110px;">
												등급 <span class="client-sort-icons">▲▼</span>
											</th>
											<th class="client-sortable" data-sort-key="memberType"
												style="min-width:160px;">
												회원구분 <span class="client-sort-icons">▲▼</span>
											</th>
											<th class="client-sortable" data-sort-key="companyName"
												style="min-width:160px;">
												업체명 <span class="client-sort-icons">▲▼</span>
											</th>

											<th style="min-width:140px;">유선전화</th>
											<th style="min-width:140px;">휴대폰번호</th>
											<th style="min-width:160px;">최근주문번호</th>

											<th class="client-sortable" data-sort-key="totalOrderAmount"
												style="min-width:150px;">
												총 주문 금액 <span class="client-sort-icons">▲▼</span>
											</th>
											<th class="client-sortable" data-sort-key="totalOrderCount"
												style="min-width:130px;">
												총 주문 건수 <span class="client-sort-icons">▲▼</span>
											</th>
											<th class="client-sortable" data-sort-key="pageRank"
												style="min-width:120px;">
												금액 순위 <span class="client-sort-icons">▲▼</span>
											</th>
										</tr>
									</thead>

									<tbody>
										<tr th:if="${page == null || page.content == null || page.content.isEmpty()}">
											<td colspan="13" class="text-center text-muted py-4">조회된 데이터가 없습니다.</td>
										</tr>

										<tr th:each="row : ${page.content}">
											<td style="text-align:center;">
												<input type="checkbox" class="client-row-check"
													th:value="${row.memberId}" />
											</td>
											<td th:text="${#temporals.format(row.joinedAt, 'yyyy-MM-dd')}">-</td>

											<td>
												<a th:href="@{/admin/root/clientDetail/{id}/home(id=${row.memberId})}"
													th:text="${row.name}">이름</a>
											</td>
											<td>
												<a th:href="@{/admin/root/clientDetail/{id}/home(id=${row.memberId})}"
													th:text="${row.username}">아이디</a>
											</td>

											<td th:text="${row.memberGradeText}">-</td>
											<td th:text="${row.memberTypeText}">-</td>

											<td th:text="${row.companyName != null ? row.companyName : '해당없음'}">해당없음
											</td>
											<td th:text="${row.tel != null ? row.tel : '-'}">-</td>
											<td th:text="${row.mobile != null ? row.mobile : '-'}">-</td>
											<td th:text="${row.recentOrderNo != null ? row.recentOrderNo : '-'}">-</td>

											<td th:text="${#numbers.formatInteger(row.totalOrderAmount, 3, 'COMMA')}">0
											</td>
											<td th:text="${row.totalOrderCount}">0</td>
											<td th:text="${row.pageRank}">-</td>
										</tr>
									</tbody>
								</table>
							</div>

							<!-- Pagination -->
							<div class="d-flex justify-content-center mt-3"
								th:if="${page != null && page.totalPages > 0}">
								<nav>
									<ul class="pagination mb-0">

										<li class="page-item" th:classappend="${page.first ? 'disabled' : ''}">
											<a class="page-link"
												th:href="@{/admin/root/clientSearch(${cond.toQueryParams(0)})}">
												first
											</a>
										</li>

										<li class="page-item" th:classappend="${page.first ? 'disabled' : ''}">
											<a class="page-link"
												th:href="@{/admin/root/clientSearch(${cond.toQueryParams(page.number-1)})}">
												prev
											</a>
										</li>

										<li class="page-item" th:each="p : ${pageNumbers}"
											th:classappend="${p == page.number ? 'active' : ''}">
											<a class="page-link" th:text="${p + 1}"
												th:href="@{/admin/root/clientSearch(${cond.toQueryParams(p)})}">
												1
											</a>
										</li>

										<li class="page-item" th:classappend="${page.last ? 'disabled' : ''}">
											<a class="page-link"
												th:href="@{/admin/root/clientSearch(${cond.toQueryParams(page.number+1)})}">
												next
											</a>
										</li>

										<li class="page-item" th:classappend="${page.last ? 'disabled' : ''}">
											<a class="page-link"
												th:href="@{/admin/root/clientSearch(${cond.toQueryParams(page.totalPages-1)})}">
												last
											</a>
										</li>

									</ul>
								</nav>
							</div>

						</div>
					</div>

				</div>
			</div>

			<footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
		</div>
	</div>

	<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
	<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link rel="stylesheet" href="/administration/assets/css/page/clientManager/clientDashBoard.css">
	<script src="/administration/assets/js/page/clientManager/clientSearch.js"></script>
</body>

</html>
