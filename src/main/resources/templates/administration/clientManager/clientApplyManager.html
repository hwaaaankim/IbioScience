<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
	data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('고객회원 신청관리')}"></head>

<body>
	<div id="layout-wrapper">
		<header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
		<div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
		<div class="vertical-overlay"></div>

		<div class="main-content">
			<div class="page-content">
				<div class="container-fluid">

					<!-- Title / Breadcrumb -->
					<div class="row">
						<div class="col-12">
							<div class="page-title-box d-sm-flex align-items-center justify-content-between">
								<h4 class="mb-sm-0">회원관리</h4>
								<div class="page-title-right">
									<ol class="breadcrumb m-0">
										<li class="breadcrumb-item"><a href="javascript:void(0);">관리</a></li>
										<li class="breadcrumb-item active">고객회원 신청관리</li>
									</ol>
								</div>
							</div>
						</div>
					</div>

					<style>
						/* ===== client-apply-manager- prefix ===== */
						.client-apply-manager-card .form-label {
							margin-bottom: 0.25rem;
						}

						.client-apply-manager-filter-row .form-control,
						.client-apply-manager-filter-row .form-select {
							height: 40px;
						}

						.client-apply-manager-filter-actions .btn {
							height: 40px;
						}

						.client-apply-manager-table thead th {
							vertical-align: middle;
							white-space: nowrap;
						}

						.client-apply-manager-table tbody td {
							vertical-align: middle;
						}

						.client-apply-manager-sort-btn {
							border: 0;
							background: transparent;
							padding: 0;
							display: inline-flex;
							align-items: center;
							gap: 6px;
							color: inherit;
							font-weight: 600;
						}

						.client-apply-manager-sort-icons {
							display: inline-flex;
							flex-direction: column;
							line-height: 10px;
							font-size: 10px;
							opacity: 0.45;
						}

						.client-apply-manager-sort-icons .active {
							opacity: 1;
							font-weight: 800;
						}

						.client-apply-manager-bulk-btn {
							min-width: 110px;
						}

						.client-apply-manager-modal-label {
							font-weight: 700;
							color: #495057;
						}

						.client-apply-manager-kv {
							display: grid;
							grid-template-columns: 140px 1fr;
							gap: 8px 14px;
						}

						.client-apply-manager-kv .value {
							color: #212529;
						}

						.client-apply-manager-divider {
							border-top: 1px solid #e9ecef;
							margin: 16px 0;
						}
					</style>

					<div class="card client-apply-manager-card">
						<div class="card-body">

							<!-- ===== 검색 필터 ===== -->
							<form id="client-apply-manager-filter-form" method="get"
								action="/admin/root/clientApplyManager">
								<input type="hidden" name="page" id="client-apply-manager-page"
									th:value="${cond.page}" />
								<input type="hidden" name="sortKey" id="client-apply-manager-sortKey"
									th:value="${sortKey}" />
								<input type="hidden" name="sortDir" id="client-apply-manager-sortDir"
									th:value="${sortDir}" />

								<div class="row g-2 align-items-center client-apply-manager-filter-row">
									<div class="col-lg-1 col-md-4">
										<label class="form-label" for="client-apply-manager-size">페이지 사이즈</label>
										<select class="form-select" name="size" id="client-apply-manager-size">
											<option value="10" th:selected="${cond.size == 10}">10</option>
											<option value="30" th:selected="${cond.size == 30}">30</option>
											<option value="50" th:selected="${cond.size == 50}">50</option>
											<option value="100" th:selected="${cond.size == 100}">100</option>
										</select>
									</div>

									<div class="col-lg-1 col-md-4">
										<label class="form-label" for="client-apply-manager-fromDate">From</label>
										<input type="date" class="form-control" name="fromDate"
											id="client-apply-manager-fromDate" th:value="${cond.fromDate}" />
									</div>

									<div class="col-lg-1 col-md-4">
										<label class="form-label" for="client-apply-manager-toDate">To</label>
										<input type="date" class="form-control" name="toDate"
											id="client-apply-manager-toDate" th:value="${cond.toDate}" />
									</div>

									<div class="col-lg-2 col-md-4">
										<label class="form-label" for="client-apply-manager-searchField">검색 조건</label>
										<select class="form-select" name="searchField"
											id="client-apply-manager-searchField">
											<option value="USERNAME"
												th:selected="${cond.searchField.name() == 'USERNAME'}">아이디검색</option>
											<option value="MOBILE" th:selected="${cond.searchField.name() == 'MOBILE'}">
												연락처검색</option>
											<option value="NAME" th:selected="${cond.searchField.name() == 'NAME'}">이름검색
											</option>
										</select>
									</div>

									<div class="col-lg-2 col-md-4">
										<label class="form-label" for="client-apply-manager-keyword">키워드</label>
										<input type="text" class="form-control" name="keyword"
											id="client-apply-manager-keyword" placeholder="검색어 입력"
											th:value="${cond.keyword}" />
									</div>

									<div class="col-lg-3 col-md-8">
										<label class="form-label d-block">신청 구분</label>
										<div class="d-flex align-items-center gap-3" style="height:40px;">
											<div class="form-check">
												<input class="form-check-input" type="radio" name="applyType"
													id="client-apply-manager-apply-all" value="ALL"
													th:checked="${cond.applyType.name() == 'ALL'}" />
												<label class="form-check-label"
													for="client-apply-manager-apply-all">전체 신청</label>
											</div>
											<div class="form-check">
												<input class="form-check-input" type="radio" name="applyType"
													id="client-apply-manager-apply-personal" value="PERSONAL"
													th:checked="${cond.applyType.name() == 'PERSONAL'}" />
												<label class="form-check-label"
													for="client-apply-manager-apply-personal">일반회원 신청</label>
											</div>
											<div class="form-check">
												<input class="form-check-input" type="radio" name="applyType"
													id="client-apply-manager-apply-business" value="BUSINESS"
													th:checked="${cond.applyType.name() == 'BUSINESS'}" />
												<label class="form-check-label"
													for="client-apply-manager-apply-business">기업회원 신청</label>
											</div>
										</div>
									</div>

									<div class="col-lg-2">
										<div
											class="d-flex gap-2 client-apply-manager-filter-actions mt-2">
											<button type="submit" class="btn btn-primary w-100"
												id="client-apply-manager-search-btn">조회</button>
											<button type="button" class="btn btn-light w-100"
												id="client-apply-manager-reset-btn">초기화</button>
										</div>
									</div>
								</div>
							</form>

							<div class="client-apply-manager-divider"></div>

							<!-- ===== 테이블 상단 액션 ===== -->
							<div class="d-flex align-items-center justify-content-between mb-2">
								<div class="text-muted">
									총 <span th:text="${page.totalElements}">0</span> 건
								</div>
								<button type="button" class="btn btn-success client-apply-manager-bulk-btn"
									id="client-apply-manager-bulk-approve-btn" disabled>일괄승인</button>
							</div>

							<!-- ===== 테이블 ===== -->
							<div class="table-responsive">
								<table class="table table-bordered align-middle mb-0 client-apply-manager-table">
									<thead class="table-light">
										<tr>
											<th style="width:48px; text-align:center;">
												<input class="form-check-input" type="checkbox"
													id="client-apply-manager-check-all" />
											</th>

											<th>
												<button type="button" class="client-apply-manager-sort-btn"
													data-sort-key="username">
													아이디
													<span class="client-apply-manager-sort-icons">
														<span data-dir="asc">▲</span>
														<span data-dir="desc">▼</span>
													</span>
												</button>
											</th>

											<th>
												<button type="button" class="client-apply-manager-sort-btn"
													data-sort-key="companyName">
													업체명
													<span class="client-apply-manager-sort-icons">
														<span data-dir="asc">▲</span>
														<span data-dir="desc">▼</span>
													</span>
												</button>
											</th>

											<th>
												<button type="button" class="client-apply-manager-sort-btn"
													data-sort-key="name">
													이름
													<span class="client-apply-manager-sort-icons">
														<span data-dir="asc">▲</span>
														<span data-dir="desc">▼</span>
													</span>
												</button>
											</th>

											<th>
												<button type="button" class="client-apply-manager-sort-btn"
													data-sort-key="contact">
													연락처
													<span class="client-apply-manager-sort-icons">
														<span data-dir="asc">▲</span>
														<span data-dir="desc">▼</span>
													</span>
												</button>
											</th>

											<th>
												<button type="button" class="client-apply-manager-sort-btn"
													data-sort-key="joinedAt">
													가입신청일
													<span class="client-apply-manager-sort-icons">
														<span data-dir="asc">▲</span>
														<span data-dir="desc">▼</span>
													</span>
												</button>
											</th>

											<th style="width:140px; text-align:center;">비고</th>
										</tr>
									</thead>

									<tbody>
										<tr th:if="${page.content == null || page.content.isEmpty()}">
											<td colspan="7" class="text-center text-muted py-4">조회된 신청 데이터가 없습니다.</td>
										</tr>

										<tr th:each="row : ${page.content}">
											<td class="text-center">
												<input class="form-check-input client-apply-manager-row-check"
													type="checkbox" th:value="${row.memberId}" />
											</td>
											<td th:text="${row.username}">-</td>
											<td th:text="${row.companyNameOrDash}">- 없음-</td>
											<td th:text="${row.name}">-</td>
											<td th:text="${row.contact}">-</td>
											<td th:text="${#temporals.format(row.joinedAt, 'yyyy-MM-dd HH:mm')}">-</td>
											<td class="text-center">
												<button type="button"
													class="btn btn-sm btn-primary client-apply-manager-open-modal"
													th:attr="data-member-id=${row.memberId}">
													승인처리
												</button>
											</td>
										</tr>
									</tbody>

								</table>
							</div>

							<!-- ===== 페이지네이션 ===== -->
							<nav class="mt-3" aria-label="Page navigation">
								<ul class="pagination justify-content-center mb-0">

									<li class="page-item" th:classappend="${pagination.isFirst} ? 'disabled' : ''">
										<a class="page-link client-apply-manager-page-link" href="javascript:void(0);"
											th:attr="data-page=${pagination.firstPage}">
											FIRST
										</a>
									</li>

									<li class="page-item" th:classappend="${pagination.isFirst} ? 'disabled' : ''">
										<a class="page-link client-apply-manager-page-link" href="javascript:void(0);"
											th:attr="data-page=${pagination.prevPage}">
											PREV
										</a>
									</li>

									<li class="page-item" th:each="p : ${pagination.pageNumbers}"
										th:classappend="${p == pagination.currentPage} ? 'active' : ''">
										<a class="page-link client-apply-manager-page-link" href="javascript:void(0);"
											th:attr="data-page=${p}" th:text="${p + 1}">1</a>
									</li>

									<li class="page-item" th:classappend="${pagination.isLast} ? 'disabled' : ''">
										<a class="page-link client-apply-manager-page-link" href="javascript:void(0);"
											th:attr="data-page=${pagination.nextPage}">
											NEXT
										</a>
									</li>

									<li class="page-item" th:classappend="${pagination.isLast} ? 'disabled' : ''">
										<a class="page-link client-apply-manager-page-link" href="javascript:void(0);"
											th:attr="data-page=${pagination.lastPage}">
											LAST
										</a>
									</li>

								</ul>
							</nav>

						</div>
					</div>
				</div>
			</div>

			<footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
		</div>
	</div>

	<!-- ===== 상세 승인 모달 ===== -->
	<div class="modal fade" id="client-apply-manager-detail-modal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">신청 상세 확인</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<div id="client-apply-manager-modal-body" class="text-muted">
						불러오는 중...
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-light" data-bs-dismiss="modal">닫기</button>
					<button type="button" class="btn btn-primary"
						id="client-apply-manager-modal-approve-btn">승인하기</button>
				</div>
			</div>
		</div>
	</div>

	<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
	<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/administration/assets/js/page/clientManager/clientApplyManager.js"></script>

</body>

</html>
