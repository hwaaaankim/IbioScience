<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
	data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('고객회원관리')}"></head>

<body>
	<div id="layout-wrapper">
		<header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
		<div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
		<div class="vertical-overlay"></div>

		<div class="main-content">
			<div class="page-content">
				<div class="container-fluid">

					<!-- Title / Breadcrumb -->
					<div class="row">
						<div class="col-12">
							<div class="page-title-box d-sm-flex align-items-center justify-content-between">
								<h4 class="mb-sm-0">회원관리</h4>
								<div class="page-title-right">
									<ol class="breadcrumb m-0">
										<li class="breadcrumb-item"><a href="javascript:void(0);">관리</a></li>
										<li class="breadcrumb-item active">고객회원 대시보드</li>
									</ol>
								</div>
							</div>
						</div>
					</div>

					<!-- Filter -->
					<div class="card client-dashboard-card">
						<div class="card-body">
							<div class="row g-3 align-items-end">
								<div class="col-12 col-lg-4">
									<label for="client-dashboard-date" class="form-label mb-1">날짜 선택</label>
									<input type="date" class="form-control" id="client-dashboard-date"
										th:value="${selectedDate}">
								</div>
								<div class="col-12 col-lg-2">
									<button type="button" class="btn btn-primary w-100" id="client-dashboard-btn-search">
										조회
									</button>
								</div>

								<div class="col-12 col-lg-6">
									<div class="client-dashboard-hint">
										<span class="badge bg-soft-secondary text-secondary">안내</span>
										<span class="ms-2 text-muted">
											상단 카드의 숫자를 클릭하면 하단에 해당 로그의 멤버 목록이 표시됩니다. (방문 PV/UV는 상세 목록 미지원)
										</span>
									</div>
								</div>
							</div>

							<hr class="my-4">

							<!-- Summary Cards -->
							<div class="row g-3" id="client-dashboard-summary-cards">
								<!-- JS 렌더링 -->
							</div>
						</div>
					</div>

					<!-- Detail Table -->
					<div class="card client-dashboard-card">
						<div class="card-body">
							<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
								<div>
									<h5 class="mb-0" id="client-dashboard-detail-title">상세 목록</h5>
									<div class="text-muted small" id="client-dashboard-detail-subtitle">
										상단에서 로그 항목을 선택해주세요.
									</div>
								</div>

								<div class="client-dashboard-selected-chip d-none" id="client-dashboard-selected-chip">
									<span class="me-2">선택:</span>
									<span class="badge bg-primary" id="client-dashboard-selected-label">-</span>
								</div>
							</div>

							<div class="table-responsive">
								<table class="table table-hover align-middle mb-0 client-dashboard-table">
									<thead class="table-light">
										<tr>
											<th style="min-width:140px;">날짜/시간</th>
											<th style="min-width:120px;">아이디</th>
											<th style="min-width:120px;">이름</th>
											<th style="min-width:120px;">등급</th>
											<th style="min-width:120px;">롤</th>
											<th style="min-width:120px;">딜러</th>
											<th style="min-width:120px;">개인/기업</th>
										</tr>
									</thead>
									<tbody id="client-dashboard-detail-tbody">
										<tr>
											<td colspan="7" class="text-center text-muted py-5">
												상단 카드에서 로그 항목을 선택하면 목록이 표시됩니다.
											</td>
										</tr>
									</tbody>
								</table>
							</div>

							<!-- Pagination -->
							<nav class="mt-3 d-flex justify-content-center" aria-label="client dashboard pagination">
								<ul class="pagination mb-0" id="client-dashboard-pagination">
									<!-- JS 렌더링 -->
								</ul>
							</nav>

						</div>
					</div>

				</div>
			</div>

			<footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
		</div>
	</div>

	<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
	<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<!-- ✅ 페이지 전역 값(서버에서 오늘 날짜 기본 세팅) -->
	<script th:inline="javascript">
		/*<![CDATA[*/
		window.__CLIENT_DASHBOARD__ = {
			selectedDate: /*[[${selectedDate}]]*/ ''
		};
		/*]]>*/
	</script>

	<link rel="stylesheet" href="/administration/assets/css/page/clientManager/clientDashBoard.css">
	<script src="/administration/assets/js/page/clientManager/clientDashBoard.js"></script>

</body>
</html>
