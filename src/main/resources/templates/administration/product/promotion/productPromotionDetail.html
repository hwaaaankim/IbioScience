<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
	data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('할인혜택관리')}"></head>

<body
	th:with="
        canUpdate=${@adminMenuFacade.canUpdateByPageCode(T(com.dev.IbioScience.enums.auth.role.AdminPageCodes).PROD_PROMOTION_MANAGER)}">
	<div id="layout-wrapper">
		<header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
		<div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
		<div class="vertical-overlay"></div>

		<div class="main-content">
			<div class="page-content">
				<div class="container-fluid">
					<div class="row">
						<div class="col-12">
							<div class="page-title-box d-sm-flex align-items-center justify-content-between">
								<h4 class="mb-sm-0">할인혜택관리</h4>
								<div class="page-title-right">
									<ol class="breadcrumb m-0">
										<li class="breadcrumb-item"><a href="/productPromotionManager">프로모션 목록</a></li>
										<li class="breadcrumb-item active">프로모션 상세/수정</li>
									</ol>
								</div>
							</div>
						</div>
					</div>

					<div class="card">
						<div class="card-body">
							<h2 class="mb-4 text-center fw-bold" style="letter-spacing:-.03em;">프로모션 상세/수정</h2>

							<form id="product-promotion-form" autocomplete="off" th:action="@{/productPromotionUpdate}"
								method="post" enctype="multipart/form-data">
								<input type="hidden" name="id" th:value="${promotion.id}" />

								<!-- 공통 설정 -->
								<div class="mb-4">
									<div class="product-promotion-section-title">공통 설정 <span
											class="product-promotion-required">*</span></div>

									<div class="row g-3 align-items-center mb-2">
										<div class="col-md-6">
											<label class="product-promotion-form-label form-label mb-0">프로모션명</label>
											<input type="text" class="product-promotion-form-control form-control"
												name="name" maxlength="100" required th:value="${promotion.name}">
										</div>
										<div class="col-md-6">
											<label class="product-promotion-form-label form-label mb-0">진행여부</label>
											<select class="product-promotion-form-select form-select" name="status"
												required>
												<option value="ACTIVE" th:selected="${promotion.active}">진행중</option>
												<option value="INACTIVE" th:selected="${!promotion.active}">진행안함
												</option>
											</select>
										</div>
									</div>

									<div class="row g-3 align-items-center mb-2">
										<div class="col-md-6">
											<label class="product-promotion-form-label form-label mb-0">혜택 기간정책</label>
											<select class="product-promotion-form-select form-select" name="term"
												id="termSel" th:value="${promotion.term.name()}">
												<option value="PERIOD" th:selected="${promotion.term.name()=='PERIOD'}">
													기간한정</option>
												<option value="ALWAYS" th:selected="${promotion.term.name()=='ALWAYS'}">
													상시</option>
											</select>
										</div>
										<div class="col-md-6">
											<label class="product-promotion-form-label form-label mb-0">아이콘 업로드</label>
											<input type="file" class="product-promotion-form-control form-control"
												name="iconFile" accept="image/gif,image/png,image/jpeg">
											<div class="form-text" th:if="${promotion.iconUrl}">
												현재 아이콘: <a th:href="${promotion.iconUrl}" target="_blank"
													th:text="${promotion.iconUrl}">icon</a>
											</div>
										</div>
									</div>

									<div class="row g-3 align-items-center mb-2">
										<div class="col-md-6">
											<label class="product-promotion-form-label form-label mb-0">시작일</label>
											<input type="date" class="product-promotion-form-control form-control"
												name="startDate"
												th:value="${promotion.startDate!=null? #temporals.format(promotion.startDate,'yyyy-MM-dd'): ''}">
										</div>
										<div class="col-md-6">
											<label class="product-promotion-form-label form-label mb-0">종료일</label>
											<input type="date" class="product-promotion-form-control form-control"
												name="endDate"
												th:value="${promotion.endDate!=null? #temporals.format(promotion.endDate,'yyyy-MM-dd'): ''}">
										</div>
									</div>
								</div>

								<!-- 타입 선택 -->
								<div class="mb-3">
									<label class="product-promotion-form-label form-label mb-1">프로모션 타입 <span
											class="product-promotion-required">*</span></label>
									<div class="btn-group product-promotion-type-group" role="group"
										aria-label="PromotionType">
										<input type="radio" class="btn-check" name="type" id="type-discount"
											value="DISCOUNT" th:checked="${promotion.type.name()=='DISCOUNT'}">
										<label class="btn btn-outline-primary product-promotion-btn"
											for="type-discount">할인</label>

										<input type="radio" class="btn-check" name="type" id="type-gift" value="GIFT"
											th:checked="${promotion.type.name()=='GIFT'}">
										<label class="btn btn-outline-primary product-promotion-btn"
											for="type-gift">증정</label>

										<input type="radio" class="btn-check" name="type" id="type-oneplusone"
											value="ONE_PLUS_ONE" th:checked="${promotion.type.name()=='ONE_PLUS_ONE'}">
										<label class="btn btn-outline-primary product-promotion-btn"
											for="type-oneplusone">1+1</label>

										<input type="radio" class="btn-check" name="type" id="type-coupon"
											value="COUPON" th:checked="${promotion.type.name()=='COUPON'}">
										<label class="btn btn-outline-primary product-promotion-btn"
											for="type-coupon">쿠폰</label>
									</div>
								</div>

								<!-- 타입별 영역 (등록폼과 동일) -->
								<div id="product-promotion-type-area">
									<!-- 할인 -->
									<div class="product-promotion-type-panel" data-type="DISCOUNT">
										<div class="product-promotion-section-title">할인 설정</div>
										<div class="row mb-3">
											<div class="col-md-6">
												<label class="product-promotion-form-label form-label mb-0">할인율
													(%)</label>
												<input type="number" min="0" max="100" step="1"
													class="product-promotion-form-control form-control"
													name="discountPercent" placeholder="0"
													th:value="${promotion.discountPercent}">
											</div>
										</div>
									</div>

									<!-- 증정 -->
									<div class="product-promotion-type-panel" data-type="GIFT">
										<div class="product-promotion-section-title">증정 상품 등록</div>
										<div class="row mb-2">
											<div class="col-md-4">
												<label class="form-label">대분류</label>
												<select id="giftCategoryLarge" class="form-select"></select>
											</div>
											<div class="col-md-4">
												<label class="form-label">중분류</label>
												<select id="giftCategoryMedium" class="form-select"></select>
											</div>
											<div class="col-md-4">
												<label class="form-label">소분류</label>
												<select id="giftCategorySmall" class="form-select"></select>
											</div>
										</div>
										<div class="mb-2">
											<label class="form-label">제품 목록</label>
											<div id="giftProductList"></div>
										</div>
										<div>
											<label class="form-label">선택된 증정 상품</label>
											<div id="selectedGiftProductList" class="d-flex flex-wrap gap-2"></div>
										</div>
									</div>

									<!-- 1+1 -->
									<div class="product-promotion-type-panel" data-type="ONE_PLUS_ONE">
										<div class="product-promotion-section-title">1+1 프로모션</div>
										<div class="alert alert-info small mb-0">
											별도의 추가 입력 없이 <b>1+1 프로모션</b>으로 등록됩니다.
										</div>
									</div>

									<!-- 쿠폰 -->
									<div class="product-promotion-type-panel" data-type="COUPON">
										<div class="product-promotion-section-title">쿠폰 검색 및 선택</div>
										<div class="product-promotion-search-area mb-2">
											<div class="row mb-2">
												<div class="col-md-3">
													<label class="product-promotion-form-label mb-1">쿠폰상태</label>
													<select class="product-promotion-form-select form-select"
														id="couponStatus" disabled>
														<option value="ISSUED" selected>발급됨</option>
													</select>
												</div>
												<div class="col-md-3">
													<label class="product-promotion-form-label mb-1">쿠폰명</label>
													<input type="text"
														class="product-promotion-form-control form-control"
														id="couponKeyword" placeholder="쿠폰명">
												</div>
												<div class="col-md-3">
													<label class="product-promotion-form-label mb-1">발행 시작일</label>
													<input type="date"
														class="product-promotion-form-control form-control"
														id="couponStartDate">
												</div>
												<div class="col-md-3">
													<label class="product-promotion-form-label mb-1">발행 종료일</label>
													<input type="date"
														class="product-promotion-form-control form-control"
														id="couponEndDate">
												</div>
											</div>
											<div class="text-end mb-2">
												<button type="button"
													class="btn btn-outline-primary btn-sm product-promotion-search-btn"
													id="couponSearchBtn">검색</button>
											</div>
											<label class="product-promotion-form-label mb-1">검색결과</label>
											<div class="product-promotion-list-group" id="couponList"></div>
										</div>
										<div>
											<label class="product-promotion-form-label mb-1">등록된 쿠폰</label>
											<div id="selectedCouponList" class="d-flex flex-wrap gap-2"></div>
										</div>
									</div>
								</div>

								<div class="text-end mt-4">
									<button type="submit" class="product-promotion-btn btn px-4"
										id="productPromotionSubmitBtn" th:if="${canUpdate}">수정</button>
								</div>
							</form>

							<div th:if="${message}" class="alert alert-success mt-3" th:text="${message}"></div>
							<div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
						</div>
					</div>
				</div>
			</div>
			<footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
		</div>
	</div>

	<!-- 초기 상태 주입용 데이터 (data-* 기반, JS 인라인 렌더링 제거) -->
	<div id="promotion-seed" th:data-id="${promotion.id}" th:data-type="${promotion.type.name()}"
		th:data-term="${promotion.term.name()}"
		th:data-sdate="${promotion.startDate != null ? #temporals.format(promotion.startDate,'yyyy-MM-dd') : ''}"
		th:data-edate="${promotion.endDate != null ? #temporals.format(promotion.endDate,'yyyy-MM-dd') : ''}"
		th:data-discount-percent="${promotion.discountPercent}"
		th:data-gift-id="${promotion.giftProduct != null ? promotion.giftProduct.id : ''}"
		th:data-gift-name="${promotion.giftProduct != null ? promotion.giftProduct.name : ''}"
		th:data-coupon-id="${promotion.coupon != null ? promotion.coupon.id : ''}"
		th:data-coupon-name="${promotion.coupon != null ? promotion.coupon.couponName : ''}"
		th:data-coupon-sdate="${promotion.coupon != null && promotion.coupon.startDate != null ? promotion.coupon.startDate : ''}"
		th:data-coupon-edate="${promotion.coupon != null && promotion.coupon.endDate != null ? promotion.coupon.endDate : ''}"
		style="display:none"></div>

	<script>
		(function () {
			var el = document.getElementById('promotion-seed');
			if (!el) return;
			var d = el.dataset;

			// 기본 컨테이너
			window.__promotion__ = {
				id: d.id ? Number(d.id) : null,
				type: d.type || 'DISCOUNT',
				term: d.term || 'PERIOD',
				startDate: d.sdate || null,
				endDate: d.edate || null,
				discountPercent: (d.discountPercent !== undefined && d.discountPercent !== '' && d.discountPercent !== null)
					? Number(d.discountPercent) : null
			};

			// giftProduct (존재 시에만)
			if (d.giftId) {
				window.__promotion__.giftProduct = {
					id: Number(d.giftId),
					name: d.giftName || ''
				};
			}

			// coupon (존재 시에만)
			if (d.couponId) {
				window.__promotion__.coupon = {
					id: Number(d.couponId),
					couponName: d.couponName || '',
					startDate: d.couponSdate || null,
					endDate: d.couponEdate || null,
					status: 'ISSUED'
				};
			}
		})();
	</script>



	<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
	<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
	<script src="/administration/assets/product/productPromotionDetail.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
