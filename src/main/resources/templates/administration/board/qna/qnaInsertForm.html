<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
      data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('QNA 등록')}"></head>

<body>
<div id="layout-wrapper">
    <header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
    <div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
    <div class="vertical-overlay"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid">

                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0">QNA 등록</h4>
                            <div class="page-title-right">
                                <ol class="breadcrumb m-0">
                                    <li class="breadcrumb-item"><a href="javascript:void(0);">관리</a></li>
                                    <li class="breadcrumb-item active">QNA 등록</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">

                        <div class="row g-3">

                            <div class="col-md-4">
                                <label class="form-label">카테고리</label>
                                <select class="form-select qna-insert-category" id="qna-insert-category">
                                    <option value="">선택</option>
                                    <option th:each="c : ${categories}"
                                            th:value="${c.id}"
                                            th:text="${c.name}">카테고리</option>
                                </select>
                            </div>

                            <div class="col-md-8">
                                <label class="form-label">제목</label>
                                <input type="text" class="form-control qna-insert-title" id="qna-insert-title">
                            </div>

                            <div class="col-12">
                                <label class="form-label">내용</label>
                                <textarea id="qna-insert-editor" class="form-control" rows="12"></textarea>
                            </div>

                            <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                                <a href="/admin/manager/qnaManager" class="btn btn-outline-secondary">목록</a>
                                <button type="button" class="btn btn-primary" id="qna-insert-btn-save">등록</button>
                            </div>

                        </div>

                    </div>
                </div>

            </div>
        </div>

        <footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/40.0.0/classic/ckeditor.js"></script>
<script src="/administration/assets/js/page/shopManager/board/qna/qnaInsertForm.js" type="text/javascript"></script>
</body>
</html>
