<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
      data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('QNA 카테고리 관리')}"></head>

<body>
<div id="layout-wrapper">
    <header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
    <div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
    <div class="vertical-overlay"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid"
                 th:with="
                    canCreate=${@adminMenuFacade.canCreateByPageCode('SITE_QNA_CATEGORY_MANAGER')},
                    canUpdate=${@adminMenuFacade.canUpdateByPageCode('SITE_QNA_CATEGORY_MANAGER')},
                    canDelete=${@adminMenuFacade.canDeleteByPageCode('SITE_QNA_CATEGORY_MANAGER')}
                 ">

                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0">QNA 카테고리 관리</h4>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">

                        <div th:if="${canCreate}" class="row g-2 align-items-end qna-category-manager-form">
                            <div class="col-md-6">
                                <label class="form-label">카테고리명</label>
                                <input type="text" class="form-control" id="qna-category-create-name"
                                       placeholder="예: 배송/결제/교환/반품 등">
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-primary w-100" id="qna-category-create-btn">
                                    등록
                                </button>
                            </div>
                        </div>

                        <hr class="my-4"/>

                        <div class="table-responsive">
                            <table class="table table-bordered align-middle">
                                <thead class="table-light">
                                <tr>
                                    <th style="width:90px;">ID</th>
                                    <th>카테고리명</th>
                                    <th style="width:140px;">QNA 개수</th>
                                    <th style="width:220px;">관리</th>
                                </tr>
                                </thead>
                                <tbody id="qna-category-tbody">

                                <tr th:if="${categoryRows == null or #lists.isEmpty(categoryRows)}">
                                    <td colspan="4" class="text-center text-muted py-4">등록된 카테고리가 없습니다.</td>
                                </tr>

                                <tr th:each="row : ${categoryRows}"
                                    th:attr="data-category-id=${row.category.id}">
                                    <td th:text="${row.category.id}">1</td>

                                    <td>
                                        <span class="qna-category-name-text"
                                              th:text="${row.category.name}">카테고리</span>

                                        <input type="text"
                                               class="form-control d-none qna-category-name-input"
                                               th:value="${row.category.name}">
                                    </td>

                                    <td class="text-center">
                                        <span class="badge bg-info"
                                              th:text="${row.qnaCount}">0</span>
                                    </td>

                                    <td>
                                        <div class="d-flex gap-2 justify-content-center">
                                            <button th:if="${canUpdate}"
                                                    type="button"
                                                    class="btn btn-sm btn-outline-primary qna-category-btn-edit">
                                                수정
                                            </button>
                                            <button th:if="${canDelete}"
                                                    type="button"
                                                    class="btn btn-sm btn-outline-danger qna-category-btn-delete">
                                                삭제
                                            </button>
                                        </div>
                                    </td>
                                </tr>

                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>

            </div>
        </div>

        <footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    window.qnaCategoryPermissions = {
        canCreate: /*[[${canCreate}]]*/ false,
        canUpdate: /*[[${canUpdate}]]*/ false,
        canDelete: /*[[${canDelete}]]*/ false
    };
</script>

<script src="/administration/assets/js/page/shopManager/board/qna/qnaCategoryManager.js" type="text/javascript"></script>
</body>
</html>
