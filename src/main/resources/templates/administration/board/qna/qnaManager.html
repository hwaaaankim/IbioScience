<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
      data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('QNA 관리')}"></head>

<body>
<div id="layout-wrapper">
    <header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
    <div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
    <div class="vertical-overlay"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid"
                 th:with="
                    canView=${@adminMenuFacade.canViewByPageCode('SITE_QNA_MANAGER')},
                    canCreate=${@adminMenuFacade.canCreateByPageCode('SITE_QNA_MANAGER')},
                    canDelete=${@adminMenuFacade.canDeleteByPageCode('SITE_QNA_MANAGER')}
                 ">

                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0">QNA 관리</h4>
                            <div class="page-title-right">
                                <ol class="breadcrumb m-0">
                                    <li class="breadcrumb-item"><a href="javascript:void(0);">관리</a></li>
                                    <li class="breadcrumb-item active">QNA 관리</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">

                        <form method="get" action="/admin/manager/qnaManager"
                              class="row g-2 align-items-end qna-manager-filter-form">

                            <div class="col-md-4">
                                <label class="form-label">제목</label>
                                <input type="text" class="form-control qna-manager-title"
                                       name="title" th:value="${title}">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">작성일 From</label>
                                <input type="date" class="form-control qna-manager-from"
                                       name="from" th:value="${from}">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">작성일 To</label>
                                <input type="date" class="form-control qna-manager-to"
                                       name="to" th:value="${to}">
                            </div>

                            <div class="col-md-2">
                                <label class="form-label">페이지 사이즈</label>
                                <select class="form-select qna-manager-size" name="size">
                                    <option value="10" th:selected="${size == 10}">10</option>
                                    <option value="30" th:selected="${size == 30}">30</option>
                                    <option value="50" th:selected="${size == 50}">50</option>
                                    <option value="70" th:selected="${size == 70}">70</option>
                                    <option value="100" th:selected="${size == 100}">100</option>
                                </select>
                            </div>

                            <div class="col-12 d-flex justify-content-between mt-2">
                                <div>
                                    <button type="submit" class="btn btn-primary qna-manager-btn-search">
                                        검색
                                    </button>
                                </div>
                                <div>
                                    <a th:if="${canCreate}"
                                       class="btn btn-success qna-manager-btn-insert"
                                       href="/admin/manager/qnaInsertForm">
                                        QNA 등록
                                    </a>
                                </div>
                            </div>

                            <input type="hidden" name="page" value="0"/>
                        </form>

                        <hr class="my-4"/>

                        <div class="table-responsive">
                            <table class="table table-bordered table-hover align-middle qna-manager-table">
                                <thead class="table-light">
                                <tr>
                                    <th style="width:90px;">ID</th>
                                    <th>제목</th>
                                    <th style="width:130px;">조회수</th>
                                    <th style="width:220px;">작성일</th>
                                    <th style="width:220px;">최근수정</th>
                                    <th style="width:120px;">관리</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${qnaPage == null or qnaPage.totalElements == 0}">
                                    <td colspan="6" class="text-center text-muted py-4">
                                        조회된 QNA가 없습니다.
                                    </td>
                                </tr>

                                <tr th:each="q : ${qnaPage.content}">
                                    <td th:text="${q.id}">1</td>
                                    <td>
                                        <a th:if="${canView}"
                                           th:href="@{/admin/manager/qnaDetail/{id}(id=${q.id})}"
                                           th:text="${q.title}">제목</a>
                                        <span th:unless="${canView}" th:text="${q.title}"></span>
                                    </td>
                                    <td th:text="${q.viewCount}">0</td>
                                    <td th:text="${#temporals.format(q.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                    <td th:text="${#temporals.format(q.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                                    <td>
                                        <div class="d-flex gap-2 justify-content-center">
                                            <a th:if="${canView}"
                                               class="btn btn-sm btn-outline-primary"
                                               th:href="@{/admin/manager/qnaDetail/{id}(id=${q.id})}">
                                                상세
                                            </a>
                                            <button th:if="${canDelete}"
                                                    type="button"
                                                    class="btn btn-sm btn-outline-danger qna-manager-btn-delete"
                                                    th:attr="data-qna-id=${q.id}">
                                                삭제
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <nav th:if="${qnaPage != null and qnaPage.totalPages > 1}" class="mt-3">
                            <ul class="pagination justify-content-center qna-manager-pagination">

                                <li class="page-item" th:classappend="${qnaPage.first} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/admin/manager/qnaManager(
                                       title=${title}, from=${from}, to=${to}, size=${size}, page=${qnaPage.number - 1}
                                       )}">이전</a>
                                </li>

                                <li class="page-item"
                                    th:each="p : ${#numbers.sequence(0, qnaPage.totalPages - 1)}"
                                    th:classappend="${p == qnaPage.number} ? 'active'">
                                    <a class="page-link"
                                       th:text="${p + 1}"
                                       th:href="@{/admin/manager/qnaManager(
                                       title=${title}, from=${from}, to=${to}, size=${size}, page=${p}
                                       )}">1</a>
                                </li>

                                <li class="page-item" th:classappend="${qnaPage.last} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/admin/manager/qnaManager(
                                       title=${title}, from=${from}, to=${to}, size=${size}, page=${qnaPage.number + 1}
                                       )}">다음</a>
                                </li>

                            </ul>
                        </nav>

                    </div>
                </div>

            </div>
        </div>

        <footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/administration/assets/js/page/shopManager/board/qna/qnaManager.js" type="text/javascript"></script>
</body>
</html>
