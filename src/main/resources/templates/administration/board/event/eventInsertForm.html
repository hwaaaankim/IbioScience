<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
	data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('이벤트 등록')}"></head>

<body>
	<div id="layout-wrapper">
		<header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
		<div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
		<div class="vertical-overlay"></div>

		<div class="main-content">
			<div class="page-content">
				<div class="container-fluid" th:with="
						canCreate=${@adminMenuFacade.canCreateByPageCode('SITE_EVENT_MANAGER')},
						canView=${@adminMenuFacade.canViewByPageCode('SITE_EVENT_MANAGER')}
					">

					<div class="row">
						<div class="col-12">
							<div class="page-title-box d-sm-flex align-items-center justify-content-between">
								<h4 class="mb-sm-0">이벤트 관리</h4>
								<div class="page-title-right">
									<ol class="breadcrumb m-0">
										<li class="breadcrumb-item"><a href="javascript:void(0);">관리</a></li>
										<li class="breadcrumb-item active">이벤트 등록</li>
									</ol>
								</div>
							</div>
						</div>
					</div>

					<div class="card">
						<div class="card-body">

							<form class="event-insert-form" th:action="@{/admin/manager/event/create}" method="post"
								enctype="multipart/form-data">

								<div class="row g-3">
									<div class="col-md-8">
										<label class="form-label">제목 <span class="text-danger">*</span></label>
										<input type="text" class="form-control event-insert-title" name="title" required
											maxlength="200">
									</div>

									<div class="col-md-2">
										<label class="form-label">시작일 <span class="text-danger">*</span></label>
										<input type="date" class="form-control event-insert-start" name="startDate"
											required>
									</div>

									<div class="col-md-2">
										<label class="form-label">종료일 <span class="text-danger">*</span></label>
										<input type="date" class="form-control event-insert-end" name="endDate"
											required>
									</div>

									<div class="col-md-12">
										<label class="form-label">대표이미지 <span class="text-danger">*</span></label>
										<input type="file" class="form-control event-insert-rep" name="repImage"
											accept="image/*" required>

										<small class="text-muted d-block mt-1">권장: 1200px 이상 / JPG, PNG</small>

										<div class="event-rep-preview-wrap mt-2 d-none"
											style="width:450px; height:300px; position:relative; border:1px solid #e5e7eb; border-radius:8px; overflow:hidden; background:#f8f9fa;">
											<button type="button" class="btn btn-sm btn-danger event-rep-preview-remove"
												aria-label="대표이미지 삭제"
												style="position:absolute; top:8px; right:8px; z-index:2; width:28px; height:28px; padding:0; line-height:1; border-radius:50%;">
												&times;
											</button>

											<img class="event-rep-preview-img" alt="대표이미지 미리보기"
												style="width:100%; height:100%; object-fit:cover; display:block;">
										</div>
									</div>

									<div class="col-12">
										<label class="form-label">상세 내용</label>
										<textarea id="event-insert-editor" class="form-control event-insert-editor"
											name="contentHtml" rows="10"></textarea>
									</div>

									<div class="col-12 d-flex justify-content-between mt-2">
										<a th:if="${canView}" class="btn btn-light"
											th:href="@{/admin/manager/eventManager}">
											목록
										</a>
										<div th:unless="${canView}"></div>

										<button th:if="${canCreate}" type="submit"
											class="btn btn-primary event-insert-submit">
											등록
										</button>
									</div>
								</div>

							</form>

						</div>
					</div>
				</div>
			</div>

			<footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
		</div>
	</div>

	<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
	<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.ckeditor.com/ckeditor5/40.0.0/classic/ckeditor.js"></script>

	<script th:inline="javascript">
		window.eventInsertPermissions = {
			canCreate: /*[[${canCreate}]]*/ false
		};
	</script>
	<script th:src="@{/administration/assets/js/page/shopManager/board/event/eventInsertForm.js}"></script>
</body>

</html>
