<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
	data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('이벤트 상세')}"></head>

<body>
	<div id="layout-wrapper">
		<header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
		<div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
		<div class="vertical-overlay"></div>

		<div class="main-content">
			<div class="page-content">
				<div class="container-fluid">
					<div class="row">
						<div class="col-12">
							<div class="page-title-box d-sm-flex align-items-center justify-content-between">
								<h4 class="mb-sm-0">이벤트 관리</h4>
								<div class="page-title-right">
									<ol class="breadcrumb m-0">
										<li class="breadcrumb-item"><a href="javascript:void(0);">관리</a></li>
										<li class="breadcrumb-item active">이벤트 상세</li>
									</ol>
								</div>
							</div>
						</div>
					</div>

					<div class="row" th:if="${msg != null}">
						<div class="col-12">
							<div class="alert alert-success" th:text="${msg}"></div>
						</div>
					</div>

					<div class="card">
						<div class="card-body">

							<div class="d-flex justify-content-between align-items-start mb-3">
								<div>
									<h5 class="mb-1" th:text="${event.title}">이벤트 제목</h5>
									<div class="text-muted small">
										ID: <span th:text="${event.id}"></span>
										&nbsp;|&nbsp;
										작성일: <span
											th:text="${#temporals.format(event.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
										&nbsp;|&nbsp;
										수정일: <span
											th:text="${#temporals.format(event.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
										&nbsp;|&nbsp;
										조회수: <span th:text="${event.viewCount}"></span>
									</div>
								</div>

								<div class="d-flex gap-2">
									<a class="btn btn-light" th:href="@{/admin/manager/eventManager}">목록</a>

									<!-- ✅ 원본 유지: event-detail-delete-btn -->
									<button type="button" class="btn btn-outline-danger event-detail-delete-btn"
										th:attr="data-id=${event.id}">
										삭제
									</button>
								</div>
							</div>

							<form class="event-detail-form"
								th:action="@{/admin/manager/event/update/{id}(id=${event.id})}" method="post"
								enctype="multipart/form-data">

								<div class="row g-3">
									<div class="col-md-8">
										<label class="form-label">제목 <span class="text-danger">*</span></label>
										<input type="text" class="form-control event-detail-title" name="title" required
											maxlength="200" th:value="${event.title}">
									</div>

									<div class="col-md-2">
										<label class="form-label">시작일 <span class="text-danger">*</span></label>
										<input type="date" class="form-control event-detail-start" name="startDate"
											required th:value="${event.startDate}">
									</div>

									<div class="col-md-2">
										<label class="form-label">종료일 <span class="text-danger">*</span></label>
										<input type="date" class="form-control event-detail-end" name="endDate" required
											th:value="${event.endDate}">
									</div>

									<!-- ✅ 대표이미지: col-md-12 + 프리뷰(450x300) + 초기화 -->
									<div class="col-md-12">
										<label class="form-label">대표이미지</label>
										<input type="file" class="form-control event-detail-rep" name="repImage"
											accept="image/*">
										<small class="text-muted d-block mt-1">선택 시 대표이미지가 교체됩니다.</small>

										<!-- 원본 이미지 URL을 JS로 전달 -->
										<div class="event-rep-preview-wrap mt-2"
											th:attr="data-original-url=${event.repImageUrl}"
											style="width:450px; height:300px; position:relative; border:1px solid #e5e7eb; border-radius:8px; overflow:hidden; background:#f8f9fa;">

											<button type="button"
												class="btn btn-sm btn-secondary event-rep-preview-reset"
												style="position:absolute; top:8px; right:8px; z-index:2;">
												초기화
											</button>

											<!-- JS가 원본/새이미지로 교체 표시 -->
											<img class="event-rep-preview-img" alt="대표이미지 미리보기"
												style="width:100%; height:100%; object-fit:cover; display:none;">

											<div class="event-rep-preview-empty d-flex align-items-center justify-content-center"
												style="width:100%; height:100%; display:none;">
												<span class="text-muted small">대표이미지가 없습니다.</span>
											</div>
										</div>
									</div>

									<div class="col-12">
										<label class="form-label">상세 내용</label>

										<!-- ✅ 원본 유지 -->
										<textarea id="event-detail-editor" class="form-control event-detail-editor"
											name="contentHtml" rows="10" th:utext="${event.contentHtml}"></textarea>
									</div>

									<div class="col-12 d-flex justify-content-end mt-2">
										<button type="submit" class="btn btn-primary event-detail-save-btn">
											수정 저장
										</button>
									</div>
								</div>

							</form>

						</div>
					</div>
				</div>
			</div>

			<footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
		</div>
	</div>

	<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
	<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.ckeditor.com/ckeditor5/40.0.0/classic/ckeditor.js"></script>

	<script th:src="@{/administration/assets/js/page/shopManager/board/event/eventDetail.js}"></script>
</body>

</html>
