<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
      data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('공지사항 상세/수정')}"></head>

<body>
<div id="layout-wrapper">
    <header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
    <div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
    <div class="vertical-overlay"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid"
                 th:with="
                    canView=${@adminMenuFacade.canViewByPageCode('SITE_NOTICE_MANAGER')},
                    canUpdate=${@adminMenuFacade.canUpdateByPageCode('SITE_NOTICE_MANAGER')}
                 ">

                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0">공지사항 상세/수정</h4>
                            <div class="page-title-right">
                                <ol class="breadcrumb m-0">
                                    <li class="breadcrumb-item"><a href="javascript:void(0);">관리</a></li>
                                    <li class="breadcrumb-item active">공지사항 상세</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row" th:if="${!canUpdate}">
                    <div class="col-12">
                        <div class="alert alert-secondary mb-3">
                            현재 계정은 공지사항 수정 권한이 없어 읽기 전용으로 표시됩니다.
                        </div>
                    </div>
                </div>

                <div class="card notice-detail-card">
                    <div class="card-body">

                        <input type="hidden" id="notice-detail-id" th:value="${notice.id}"/>

                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">제목</label>
                                <input type="text"
                                       class="form-control notice-detail-title"
                                       id="notice-detail-title"
                                       maxlength="200"
                                       th:value="${notice.title}"
                                       th:readonly="${!canUpdate}"/>
                            </div>

                            <div class="col-12">
                                <label class="form-label">내용</label>
                                <textarea id="notice-detail-editor"
                                          class="form-control"
                                          rows="12"
                                          th:utext="${notice.contentHtml}"
                                          th:attr="data-can-update=${canUpdate}"></textarea>
                            </div>

                            <div class="col-12 text-muted small">
                                <span th:text="'작성일: ' + (${notice.createdAt != null ? #temporals.format(notice.createdAt,'yyyy-MM-dd HH:mm') : '-'})"></span>
                                <span class="mx-2">|</span>
                                <span th:text="'수정일: ' + (${notice.updatedAt != null ? #temporals.format(notice.updatedAt,'yyyy-MM-dd HH:mm') : '-'})"></span>
                                <span class="mx-2">|</span>
                                <span th:text="'조회수: ' + ${notice.viewCount}"></span>
                            </div>
                        </div>

                        <input type="hidden" id="notice-detail-draftKey"/>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:if="${canView}"
                               href="/admin/manager/noticeManager"
                               class="btn btn-light notice-detail-back">
                                목록
                            </a>
                            <button th:if="${canUpdate}"
                                    type="button"
                                    class="btn btn-primary notice-detail-update"
                                    id="notice-detail-update">
                                수정
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>

        <footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/40.0.0/classic/ckeditor.js"></script>

<script th:inline="javascript">
    window.noticeDetailPermissions = {
        canUpdate: /*[[${canUpdate}]]*/ false
    };
</script>

<script src="/administration/assets/js/page/shopManager/board/notice/noticeDetail.js" type="text/javascript"></script>
</body>
</html>
