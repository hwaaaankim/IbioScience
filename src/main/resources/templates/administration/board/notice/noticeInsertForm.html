<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
      data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('공지사항 등록')}"></head>

<body>
<div id="layout-wrapper">
    <header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
    <div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
    <div class="vertical-overlay"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid"
                 th:with="
                    canView=${@adminMenuFacade.canViewByPageCode('SITE_NOTICE_MANAGER')},
                    canCreate=${@adminMenuFacade.canCreateByPageCode('SITE_NOTICE_MANAGER')}
                 ">

                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0">공지사항 등록</h4>
                            <div class="page-title-right">
                                <ol class="breadcrumb m-0">
                                    <li class="breadcrumb-item"><a href="javascript:void(0);">관리</a></li>
                                    <li class="breadcrumb-item active">공지사항 등록</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card notice-detail-card">
                    <div class="card-body">

                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">제목</label>
                                <input type="text"
                                       class="form-control notice-detail-title"
                                       id="notice-detail-title"
                                       maxlength="200"/>
                            </div>

                            <div class="col-12">
                                <label class="form-label">내용</label>
                                <textarea id="notice-detail-editor" class="form-control" rows="12"></textarea>
                            </div>
                        </div>

                        <input type="hidden" id="notice-detail-draftKey"/>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:if="${canView}"
                               href="/admin/manager/noticeManager"
                               class="btn btn-light notice-detail-cancel">
                                목록
                            </a>
                            <button th:if="${canCreate}"
                                    type="button"
                                    class="btn btn-primary notice-detail-save"
                                    id="notice-detail-save">
                                등록
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>

        <footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/40.0.0/classic/ckeditor.js"></script>

<script th:inline="javascript">
    window.noticeInsertPermissions = {
        canCreate: /*[[${canCreate}]]*/ false
    };
</script>

<script src="/administration/assets/js/page/shopManager/board/notice/noticeInsertForm.js" type="text/javascript"></script>
</body>
</html>
