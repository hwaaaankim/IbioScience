<!doctype html>
<html lang="ko" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
      data-sidebar-image="none" data-preloader="disable" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/administration/common :: ibioAdminHead('공지사항 관리')}"></head>

<body>
<div id="layout-wrapper">
    <header id="page-topbar" th:replace="~{fragments/administration/common :: ibioAdminHeaderMenu}"></header>
    <div class="app-menu navbar-menu" th:replace="~{fragments/administration/common :: ibioAdminSideMenu}"></div>
    <div class="vertical-overlay"></div>

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid">

                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0">공지사항 관리</h4>
                            <div class="page-title-right">
                                <ol class="breadcrumb m-0">
                                    <li class="breadcrumb-item"><a href="javascript:void(0);">관리</a></li>
                                    <li class="breadcrumb-item active">공지사항 관리</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card notice-manager-card">
                    <div class="card-body">

                        <form method="get" action="/admin/manager/noticeManager" class="notice-manager-filter-form">
                            <div class="row g-2 align-items-end">
                                <div class="col-md-4">
                                    <label class="form-label">제목</label>
                                    <input type="text" class="form-control notice-manager-title"
                                           name="title" th:value="${cond.title}" placeholder="제목 검색"/>
                                </div>

                                <div class="col-md-2">
                                    <label class="form-label">작성일 From</label>
                                    <input type="date" class="form-control notice-manager-from"
                                           name="from" th:value="${cond.from}"/>
                                </div>

                                <div class="col-md-2">
                                    <label class="form-label">작성일 To</label>
                                    <input type="date" class="form-control notice-manager-to"
                                           name="to" th:value="${cond.to}"/>
                                </div>

                                <div class="col-md-2">
                                    <label class="form-label">페이지 사이즈</label>
                                    <select class="form-select notice-manager-size" name="size">
                                        <option value="10" th:selected="${size == 10}">10</option>
                                        <option value="30" th:selected="${size == 30}">30</option>
                                        <option value="50" th:selected="${size == 50}">50</option>
                                        <option value="70" th:selected="${size == 70}">70</option>
                                        <option value="100" th:selected="${size == 100}">100</option>
                                    </select>
                                </div>

                                <div class="col-md-2 d-flex justify-content-end gap-2">
                                    <button type="submit" class="btn btn-primary notice-manager-search-btn">
                                        검색
                                    </button>
                                    <a href="/admin/manager/noticeInsertForm" class="btn btn-success notice-manager-insert-btn">
                                        공지사항 등록
                                    </a>
                                </div>
                            </div>

                            <!-- page는 검색 시 0으로 초기화 -->
                            <input type="hidden" name="page" value="0"/>
                        </form>

                        <hr class="my-4"/>

                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle notice-manager-table">
                                <thead>
                                <tr>
                                    <th style="width:90px;">ID</th>
                                    <th>제목</th>
                                    <th style="width:140px;">작성자</th>
                                    <th style="width:170px;">작성일</th>
                                    <th style="width:170px;">수정일</th>
                                    <th style="width:100px;">조회수</th>
                                    <th style="width:120px;">관리</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${noticePage == null or noticePage.content == null or #lists.isEmpty(noticePage.content)}">
                                    <td colspan="7" class="text-center text-muted py-5">조회된 공지사항이 없습니다.</td>
                                </tr>

                                <tr th:each="n : ${noticePage.content}">
                                    <td th:text="${n.id}"></td>

                                    <td>
                                        <a class="notice-manager-title-link"
                                           th:href="@{/admin/manager/noticeDetail/{id}(id=${n.id})}"
                                           th:text="${n.title}"></a>
                                    </td>

                                    <td th:text="${n.writerName != null ? n.writerName : '-'}"></td>

                                    <td th:text="${n.createdAt != null ? #temporals.format(n.createdAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                                    <td th:text="${n.updatedAt != null ? #temporals.format(n.updatedAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>

                                    <td th:text="${n.viewCount}"></td>

                                    <td class="text-end">
                                        <a class="btn btn-sm btn-soft-primary"
                                           th:href="@{/admin/manager/noticeDetail/{id}(id=${n.id})}">
                                            상세
                                        </a>
                                        <button type="button"
                                                class="btn btn-sm btn-soft-danger notice-manager-delete-btn"
                                                th:attr="data-id=${n.id}">
                                            삭제
                                        </button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 페이지네이션 -->
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div class="text-muted notice-manager-pageinfo"
                                 th:if="${noticePage != null}">
                                <span th:text="'총 ' + ${noticePage.totalElements} + '건'"></span>
                                <span th:text="' / ' + (${noticePage.number}+1) + ' / ' + ${noticePage.totalPages} + '페이지'"></span>
                            </div>

                            <nav th:if="${noticePage != null and noticePage.totalPages > 1}">
                                <ul class="pagination mb-0 notice-manager-pagination">
                                    <li class="page-item" th:classappend="${noticePage.first} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{/admin/manager/noticeManager(title=${cond.title},from=${cond.from},to=${cond.to},size=${size},page=${noticePage.number-1})}">
                                            이전
                                        </a>
                                    </li>

                                    <li class="page-item"
                                        th:each="p : ${#numbers.sequence(0, noticePage.totalPages-1)}"
                                        th:if="${p >= noticePage.number-2 and p <= noticePage.number+2}"
                                        th:classappend="${p == noticePage.number} ? 'active'">
                                        <a class="page-link"
                                           th:text="${p+1}"
                                           th:href="@{/admin/manager/noticeManager(title=${cond.title},from=${cond.from},to=${cond.to},size=${size},page=${p})}"></a>
                                    </li>

                                    <li class="page-item" th:classappend="${noticePage.last} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{/admin/manager/noticeManager(title=${cond.title},from=${cond.from},to=${cond.to},size=${size},page=${noticePage.number+1})}">
                                            다음
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>

                    </div>
                </div>

            </div>
        </div>

        <footer class="footer" th:replace="~{fragments/administration/common :: ibioAdminFooter}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/administration/common :: ibioAdminButton}"></th:block>
<th:block th:replace="~{fragments/administration/common :: ibioAdminScript}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/administration/assets/js/page/shopManager/board/notice/noticeManager.js" type="text/javascript"></script>
</body>
</html>
